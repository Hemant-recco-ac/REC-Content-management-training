<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REC Portal Content Training</title>
<meta name="description" content="Interactive training for building and managing pages, wiki articles, news and events in the REC Portal — for Code Managers and the teams publishing on their behalf.">
<meta name="robots" content="noindex">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&family=Playfair+Display:ital,wght@1,700&display=swap">
<style>
:root{
  /* Colours from the RECCo Brand Guidelines (main + extended palette).
     Dark mode is the default; light mode is :root[data-mode="light"]. */
  color-scheme:dark;
  /* fixed brand colours (same in both modes) */
  --ink:#201E2E; --ink-2:#2A283B; --ink-3:#343249; --slate:#30374F; --slate-2:#3A4260; --line-dark:#3F4766;
  --on-dark:#F8F8F8; --muted-on-dark:#B9B6D2;
  --primary:#4D38F5; --primary-deep:#2D32C7; --green:#1EF395; --saltwater:#021E5E;
  /* site chrome — top bar, side nav, page headers, footer */
  --c-bg:#201E2E; --c-band:#201E2E; --c-card:#2A283B; --c-card-2:#201E2E; --c-input:#2A283B; --c-hover:#2A283B;
  --c-line:#3F4766; --c-text:#F8F8F8; --c-muted:#B9B6D2; --c-accent:#1EF395; --c-active:#30374F; --c-rail:#1EF395; --c-ok:#1EF395;
  --logo-mark:#4D38F5; --logo-text:#F8F8F8; --done:#1EF395;
  /* content surfaces */
  --bg:#17151F; --surface:#221F2E; --surface-2:#1D1B28; --text:#F2F1F8; --muted:#B9B6D2; --line:#343148; --line-2:#4A4663;
  --link:#A69CF9; --soft:#2A2552; --soft-2:#352F66;
  --ok:#2FD08A; --ok-soft:#0F2E24; --ok-line:#085D3A;
  --bad:#FF8A80; --bad-soft:#381D1F; --bad-line:#6A2E2E;
  --amber:#FEC84B; --amber-ink:#FEC84B; --amber-soft:#332812; --amber-line:#6A5020;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --font:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --topbar:64px;
}
:root[data-mode="light"]{
  color-scheme:light;
  --c-bg:#FFFFFF; --c-band:#F0EFFE; --c-card:#FFFFFF; --c-card-2:#F9F9FB; --c-input:#EFF1F5; --c-hover:#F0EFFE;
  --c-line:#DCDFEA; --c-text:#201E2E; --c-muted:#4A5578; --c-accent:#4D38F5; --c-active:#E9E7FE; --c-rail:#4D38F5; --c-ok:#067647;
  --logo-mark:#4D38F5; --logo-text:#201E2E; --done:#17B26A;
  --bg:#F9F9FB; --surface:#FFFFFF; --surface-2:#FCFCFD; --text:#201E2E; --muted:#4A5578; --line:#DCDFEA; --line-2:#B9C0D4;
  --link:#2D32C7; --soft:#F0EFFE; --soft-2:#E3DFFD;
  --ok:#067647; --ok-soft:#ECFDF3; --ok-line:#ABFEC6;
  --bad:#B42318; --bad-soft:#FDECEA; --bad-line:#F6C6C0;
  --amber:#FFB020; --amber-ink:#7A4E00; --amber-soft:#FFF4DC; --amber-line:#F5D9A0;
  --shadow:0 1px 2px rgba(32,30,46,.05),0 6px 20px rgba(32,30,46,.07);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);font-family:var(--font);color:var(--text);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.25em}
li+li{margin-top:.3em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--green);color:var(--ink);padding:8px 12px;border-radius:6px;font-weight:700;z-index:200}
.skip:focus{left:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- buttons & chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-deep)}
.btn-green{background:var(--green);color:var(--ink)}
.btn-green:hover{background:#5CF7B2}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary);color:var(--link)}
.on-dark .btn-ghost{border-color:var(--c-line);color:var(--c-text)}
.on-dark .btn-ghost:hover{border-color:var(--c-accent);color:var(--c-accent)}
.btn-sm{min-height:34px;padding:0 13px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.on-dark .linkbtn{color:var(--c-accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--link);border:1px solid var(--soft-2);white-space:nowrap}
.chip.auth{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.chip.soon{background:var(--amber-soft);color:var(--amber-ink);border-color:var(--amber-line)}
.chip.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.on-dark .chip{background:var(--c-card);color:var(--c-text);border-color:var(--c-line)}
.on-dark .chip.auth{color:var(--c-ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--link)}
.on-dark .eyebrow{color:var(--c-accent)}
.path{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;line-height:1.5}
.path svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex:none}

/* ---------- progress ---------- */
.ring{--p:0;--size:40px;--track:var(--line);--fill:var(--primary);width:var(--size);height:var(--size);border-radius:50%;background:conic-gradient(var(--fill) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ring-bg,var(--surface))}
.ring span{position:relative;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.ring.lg{--size:92px}
.ring.lg::before{inset:8px}
.ring.lg span{font-size:22px}
.ring.sm{--size:22px}
.ring.sm::before{inset:3px}
.ring.complete{--fill:var(--done)}
.on-dark .ring{--track:var(--c-line);--ring-bg:var(--c-band)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:inherit;transition:width .4s ease}
.bar.complete i{background:var(--done)}
.on-dark .bar,.topbar .bar,.sidenav .bar{background:var(--c-line)}
.on-dark .bar i,.topbar .bar i,.sidenav .bar i{background:var(--c-rail)}
.page>.hsec:first-child{margin-top:12px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--topbar);background:var(--c-bg);color:var(--c-text);border-bottom:1px solid var(--c-line);display:flex;align-items:center;gap:16px;padding-inline:20px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--c-text);white-space:nowrap}
.lm{fill:var(--logo-mark)} .lt{fill:var(--logo-text);fill-rule:evenodd}
.brand .wm{width:160px;height:auto;display:block;flex:none}
.brand .im{display:none;width:59px;height:40px;flex:none}
.mode-btn{background:none;border:1px solid var(--c-line);color:var(--c-text);border-radius:10px;height:40px;min-width:40px;padding:0 11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.mode-btn:hover{border-color:var(--c-accent);color:var(--c-accent)}
.mode-btn svg{width:17px;height:17px;flex:none}
.mode-btn .to-dark{display:none}
:root[data-mode="light"] .mode-btn .to-light{display:none}
:root[data-mode="light"] .mode-btn .to-dark{display:inline-flex}
.mode-btn span{display:inline-flex;align-items:center;gap:7px}
.lockup{display:block;width:min(300px,100%);height:auto;margin-bottom:26px}
.brand .div{width:1px;height:22px;background:var(--c-line)}
.brand .site{font-size:14px;color:var(--c-muted);font-weight:500}
.topbar .grow{flex:1}
.search{position:relative;width:min(380px,100%)}
.search input{width:100%;height:40px;border-radius:10px;border:1px solid var(--c-line);background:var(--c-input);color:var(--c-text);padding:0 52px 0 38px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--c-muted)}
.search input:focus{border-color:var(--c-accent);outline:none;box-shadow:0 0 0 3px rgba(30,243,149,.25)}
.search .ico{position:absolute;left:12px;top:12px;width:16px;height:16px;fill:none;stroke:var(--c-muted);stroke-width:2}
.search kbd{position:absolute;right:9px;top:9px;font-family:var(--font);font-size:11px;font-weight:700;color:var(--c-muted);border:1px solid var(--c-line);border-radius:5px;padding:2px 6px}
.search-results{position:absolute;top:48px;left:0;right:0;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.35);max-height:65vh;overflow:auto;padding:6px}
.search-results a{display:block;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--text)}
.search-results a:hover,.search-results a:focus{background:var(--soft);outline:none}
.search-results .t{font-weight:700;font-size:14px}
.search-results .s{font-size:12.5px;color:var(--muted)}
.search-results .empty{padding:14px 12px;color:var(--muted);font-size:14px}
.top-progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--c-muted);white-space:nowrap;text-decoration:none}
.top-progress .bar{width:90px}
.top-progress b{color:var(--c-text);font-variant-numeric:tabular-nums}
.menu-btn{display:none;background:none;border:1px solid var(--c-line);color:var(--c-text);border-radius:10px;height:40px;width:44px;cursor:pointer;align-items:center;justify-content:center}
.hub-link{font-size:14px;color:var(--c-muted);text-decoration:none;white-space:nowrap}
.hub-link:hover{color:var(--c-text);text-decoration:underline}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:calc(100vh - var(--topbar))}
.sidenav{background:var(--c-bg);color:var(--c-text);border-right:1px solid var(--c-line);padding:18px 14px 32px;position:sticky;top:calc(var(--topbar) + env(safe-area-inset-top,0px));height:calc(100vh - var(--topbar));overflow:auto;display:flex;flex-direction:column;gap:2px}
.sidenav .me{background:var(--c-card);border:1px solid var(--c-line);border-radius:var(--radius);padding:12px;margin-bottom:10px;display:grid;gap:8px}
.sidenav .me .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-muted);font-weight:700}
.sidenav .me .r{font-weight:700;font-size:14px;line-height:1.3}
.sidenav .me .row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--c-muted)}
.sidenav .me .row>*{white-space:nowrap}
.sidenav .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-muted);font-weight:700;padding:16px 10px 6px}
.sidenav a{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;font-size:14.5px;color:var(--c-text);line-height:1.3}
.sidenav a:hover{background:var(--c-card)}
.sidenav a[aria-current=page]{background:var(--c-active);font-weight:700;border-radius:0 9px 9px 0}
.sidenav a[aria-current=page]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c-rail)}
.sidenav .num{font-size:11px;font-weight:700;color:var(--c-muted);width:18px;font-variant-numeric:tabular-nums;flex:none}
.sidenav a[aria-current=page] .num{color:var(--c-accent)}
.sidenav .tail{margin-left:auto;display:flex;align-items:center}
.sidenav .soon{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:1px 6px}
.sidenav .other a{color:var(--c-muted)}
.sidenav .ring{--ring-bg:var(--c-bg);--track:var(--c-line)}
.sidenav a:hover .ring,.sidenav a[aria-current=page] .ring{--ring-bg:var(--c-active)}
.sidenav .tick{width:22px;height:22px;border-radius:50%;background:var(--done);color:var(--ink);display:grid;place-items:center}
.sidenav .tick svg{width:13px;height:13px}
main{min-width:0;background:var(--bg)}
main:focus{outline:none}
.overlay{display:none}

/* ---------- page scaffolding ---------- */
.page{max-width:1160px;margin:0 auto;padding:36px 32px 88px}
.page.narrow{max-width:960px}
.band{background:var(--c-band);color:var(--c-text);border-bottom:1px solid var(--c-line)}
.band .page{padding-block:36px 40px}
.crumbs{font-size:13.5px;color:var(--c-muted);margin-bottom:16px}
.crumbs a{color:var(--c-muted);text-decoration:none}
.crumbs a:hover{color:var(--c-text);text-decoration:underline}
.crumbs span{margin:0 6px}
.title{font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.025em;margin-top:8px}
.lede{font-size:18px;color:var(--muted);max-width:64ch;margin-top:12px}
.on-dark .lede{color:var(--c-muted)}
.with-toc{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:48px}
.toc{position:sticky;top:calc(var(--topbar) + 24px);align-self:start;font-size:13.5px}
.toc .h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:8px}
.toc a[data-toc]{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 6px 12px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none}
.toc a[data-toc]:hover{color:var(--text)}
.toc a[data-toc].active{border-color:var(--primary);color:var(--link);font-weight:600}
.toc a[data-toc] .ok{color:var(--ok);font-weight:800}
.toc .mini{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:grid;gap:10px}
.toc .mini p{font-size:12.5px;color:var(--muted)}
.section{margin-top:52px;scroll-margin-top:calc(var(--topbar) + 24px)}
.section:first-child{margin-top:0}
.section>h2{font-size:24px;letter-spacing:-.01em}
.section>.sub-l{margin-top:8px;color:var(--muted);max-width:66ch}
h3.sub{font-size:17px;margin-top:28px}
.prose{max-width:68ch}
.muted{color:var(--muted)}

/* ---------- module header ---------- */
.mhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}
.mhead .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:14px;color:var(--c-muted)}
.mhead .meta b{color:var(--c-text)}
.mhead .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.mhead .prog{display:grid;justify-items:center;gap:8px;text-align:center;font-size:12.5px;color:var(--c-muted)}
.notice{margin-top:20px;display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:12px 14px;border-radius:10px;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-ink);max-width:70ch}

/* ---------- journey flow ---------- */
.flow{overflow-x:auto;margin-top:18px;padding-bottom:4px}
.flow ol{list-style:none;padding:0;margin:0;display:flex;min-width:max-content}
.flow li{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:118px;text-align:center;position:relative;font-size:13px;font-weight:600;line-height:1.3}
.flow li::before{content:"";position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--line-2)}
.flow li:last-child::before{display:none}
.flow .n{position:relative;width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);color:var(--link);display:grid;place-items:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.flow li:first-child .n{background:var(--primary);color:#fff}
.flow li:last-child .n{background:var(--green);border-color:var(--green);color:var(--ink)}
.flow span{padding-inline:6px}

/* ---------- steps ---------- */
.steps{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 18px 16px;margin:0;scroll-margin-top:calc(var(--topbar) + 24px);transition:border-color .2s,background .2s}
.step .no{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.step.done{border-color:var(--ok-line);background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft)) padding-box}
.step.done .no{background:var(--green);color:var(--ink)}
.step h3{font-size:17px}
.step .path{margin-top:8px}
.step ul{margin-top:10px;font-size:15px}
.step ul ul{margin-top:.3em}
.why{margin-top:12px;font-size:14px;color:var(--ok);font-weight:600;display:flex;gap:8px;align-items:flex-start}
.why svg{width:16px;height:16px;flex:none;margin-top:2px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px 6px 8px;background:var(--surface);white-space:nowrap;align-self:start}
.check:hover{border-color:var(--primary);color:var(--link)}
.check .box{width:18px;height:18px;border-radius:5px;border:2px solid currentColor;display:grid;place-items:center}
.check .box svg{width:12px;height:12px;opacity:0}
.check[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check[aria-pressed=true] .box{background:var(--surface);border-color:var(--surface);color:var(--ok)}
.check[aria-pressed=true] .box svg{opacity:1}

/* ---------- panels, tips, callouts ---------- */
.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel h3{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel h3 i{width:10px;height:10px;border-radius:3px;background:var(--green)}
.panel.validate h3 i{background:var(--primary)}
.panel.can h3 i{background:var(--slate)}
.panel ul{margin-top:10px;font-size:14.5px;padding-left:1.1em}
.panel ul.checks{list-style:none;padding:0}
.panel ul.checks li{padding-left:24px;position:relative}
.panel ul.checks li::before{content:"";position:absolute;left:0;top:.3em;width:14px;height:14px;border-radius:4px;border:2px solid var(--primary)}
.tips{margin-top:18px;background:var(--ink);color:var(--on-dark);border-radius:var(--radius);padding:22px 24px}
.tips h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.tips ul{list-style:none;padding:0;margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px;font-size:14.5px}
.tips li{margin:0;display:grid;grid-template-columns:8px 1fr;gap:10px}
.tips li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:.5em}
.tips li span{color:var(--muted-on-dark)}
.callout{margin-top:18px;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--soft-2);background:var(--soft);font-size:15px;display:flex;gap:10px;align-items:flex-start}
.callout svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--link)}
.callout b{color:var(--link)}
.callout.warn{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber-ink)}
.callout.warn b,.callout.warn svg{color:var(--amber-ink)}
.good-bad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.good-bad .panel ul{list-style:none;padding:0}
.good-bad .panel li{padding-left:24px;position:relative}
.good-bad .panel li::before{position:absolute;left:0;font-weight:800}
.good-bad .good{border-top:3px solid var(--ok)}
.good-bad .bad{border-top:3px solid var(--bad)}
.good-bad .good li::before{content:"✓";color:var(--ok)}
.good-bad .bad li::before{content:"✕";color:var(--bad)}
.good-bad .foot{margin-top:12px;font-size:13.5px;color:var(--muted)}

/* page structure mock */
.pagemock{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start;margin-top:16px}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.mock .chrome{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.mock .chrome i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.mock .blocks{padding:12px;display:grid;gap:8px}
.mock button.blk{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:7px;background:var(--soft);border:1px dashed var(--soft-2);font-size:13px;font-weight:700;color:var(--link);cursor:pointer}
.mock button.blk:focus-visible{outline:3px solid var(--green)}
.mock button.blk[aria-pressed=true]{background:var(--primary);color:#fff;border-style:solid;border-color:var(--primary)}
.mock .blk.hero{min-height:70px;background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.mock .blk.cards{min-height:56px}
.mock .blk.opt{opacity:.75}
.blkinfo{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.blkinfo h4{font-size:17px}
.blkinfo dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.blkinfo dt{font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:3px}
.blkinfo dd{margin:0}

/* ---------- tables ---------- */
.tbl-wrap{position:relative;overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-weight:700;font-size:13px;color:var(--text)}
tr:last-child td{border-bottom:0}
.matrix th,.matrix td{text-align:center;vertical-align:middle}
.matrix th:first-child,.matrix td:first-child{text-align:left;font-weight:600;position:sticky;left:0;background:var(--surface);min-width:200px;z-index:1}
.matrix th:first-child{background:var(--soft)}
.matrix th{min-width:108px;vertical-align:bottom}
.matrix th button{all:unset;cursor:pointer;display:block;font-weight:700;padding:2px 4px;border-radius:6px}
.matrix th button:focus-visible{outline:3px solid var(--green)}
.matrix .y span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:800}
.matrix .n{color:var(--line-2)}
.matrix .col-on{background:var(--soft)}
.matrix th.col-on{background:var(--primary);color:#fff}
.matrix th.col-on button{color:#fff}
.matrix .y.col-on span{background:var(--green);color:var(--ink)}
.matrix tr.row-on td{box-shadow:inset 0 2px 0 var(--primary),inset 0 -2px 0 var(--primary)}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px;margin-top:22px}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mcard{display:flex;flex-direction:column;gap:10px;background:var(--surface);color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:var(--radius);padding:18px;transition:border-color .15s,transform .15s,box-shadow .15s;position:relative}
.mcard:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.mcard .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mcard .k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.mcard h3{font-size:16.5px}
.mcard p{font-size:13.5px;color:var(--muted)}
.mcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding-top:6px}
.mcard.soon{border-style:dashed}
.mcard.off{opacity:.7}
.dcard{display:flex;flex-direction:column;gap:10px;background:var(--slate);color:var(--on-dark);text-decoration:none;border-radius:var(--radius);border-top:4px solid var(--green);padding:18px 20px 20px;transition:transform .15s,background .15s}
.dcard:hover{background:var(--slate-2);transform:translateY(-2px)}
.dcard .k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted-on-dark);text-transform:uppercase}
.dcard p{font-size:13.5px;color:var(--muted-on-dark)}
.dcard.soon{border-top-color:var(--amber)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:20px 8px}
.hero h1{font-size:clamp(36px,5vw,58px);font-weight:800;letter-spacing:-.035em;margin-top:14px;line-height:1.02}
.hero h1 em,.hl{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;color:var(--c-accent);letter-spacing:-.01em}
.hero p.l{max-width:56ch;margin-top:16px;color:var(--c-muted);font-size:17px}
.hero .upd{margin-top:14px;font-size:13.5px;color:var(--c-muted)}
.picker{background:var(--c-card);border:1px solid var(--c-line);border-radius:16px;padding:20px}
.picker h2{font-size:18px}
.picker>p{font-size:14px;color:var(--c-muted);margin-top:4px}
.picker .opts{display:grid;gap:8px;margin-top:14px}
.picker button.opt{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--c-line);background:var(--c-card-2);cursor:pointer;transition:border-color .15s,background .15s}
.picker button.opt:hover{border-color:var(--c-accent)}
.picker button.opt:focus-visible{outline:3px solid var(--c-accent)}
.picker button.opt[aria-pressed=true]{border-color:var(--c-accent);background:var(--c-active)}
.picker .opt b{font-size:14.5px}
.picker .opt small{grid-column:1;font-size:12.5px;color:var(--c-muted)}
.picker .opt .n{grid-row:1/3;grid-column:2;font-size:12px;font-weight:700;color:var(--c-accent);white-space:nowrap}
.picker .skipit{margin-top:12px;font-size:13px;color:var(--c-muted)}
.resume{background:var(--c-card);border:1px solid var(--c-line);border-radius:16px;padding:22px;display:grid;gap:16px}
.resume .top{display:flex;align-items:center;gap:18px}
.resume .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-muted);font-weight:700}
.resume h2{font-size:20px;margin-top:4px}
.resume .next{background:var(--c-card-2);border:1px solid var(--c-line);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.resume .next .t{font-weight:700}
.resume .next .s{font-size:13px;color:var(--c-muted)}
.resume .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--c-card-2);border:1px solid var(--c-line);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c-text)}
.stats span{font-size:12px;color:var(--c-muted)}
.hsec{margin-top:56px}
.hsec .hh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.hsec h2{font-size:26px;letter-spacing:-.015em}
.hsec .hh p{margin-top:6px;color:var(--muted);font-size:15px;max-width:62ch}
.pathlist{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px;counter-reset:p}
.pathlist li{margin:0}
.pathlist a{display:grid;grid-template-columns:44px minmax(0,1fr) 180px auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;text-decoration:none;color:var(--text);transition:border-color .15s}
.pathlist a:hover{border-color:var(--primary)}
.pathlist .t{font-weight:700}
.pathlist .s{font-size:13px;color:var(--muted)}
.pathlist .pg{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.pathlist .go{font-size:13px;font-weight:700;color:var(--link);white-space:nowrap}
.qfilter{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.qfilter button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.qfilter button[aria-pressed=true]{background:var(--ink);color:var(--green);border-color:var(--ink)}
.qlist{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qlist li{margin:0}
.qlist a{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;text-decoration:none;color:var(--text);font-size:14.5px;font-weight:600;height:100%}
.qlist a:hover{border-color:var(--primary)}
.qlist .r{flex:none}
.footer{margin-top:72px;background:var(--c-bg);color:var(--c-muted);border-top:1px solid var(--c-line)}
.footer .page{padding-block:36px 28px;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:28px;font-size:14px}
.footer h4{color:var(--c-text);font-size:14px;margin-bottom:8px}
.footer a{color:var(--c-muted)}
.footer .box{background:var(--c-active);border-radius:var(--radius);padding:18px 20px;color:var(--c-text)}
.footer .box p{font-size:13.5px;color:var(--c-muted);margin-top:6px}
.footer .legal{grid-column:1/-1;font-size:12px;line-height:1.5;border-top:1px solid var(--c-line);padding-top:16px}
.copyrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.copyrow code{font-family:var(--mono);font-size:12.5px;background:var(--c-card);padding:5px 8px;border-radius:6px;color:var(--c-text);user-select:all}

/* ---------- roles ---------- */
.explorer{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:18px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.seg button:hover{border-color:var(--primary)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--ink);color:var(--green);border-color:var(--ink)}
.summary{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:14px}
.summary .who{background:var(--ink);color:var(--on-dark);border-radius:var(--radius);padding:18px 20px}
.summary .who h3{font-size:19px;margin-top:4px}
.summary .who .eyebrow{color:var(--green)}
.summary .who p{font-size:14px;color:var(--muted-on-dark);margin-top:8px}
.summary .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.summary .col h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.summary .col ul{list-style:none;padding:0;margin-top:10px;display:grid;gap:6px;font-size:14px}
.summary .col li{margin:0;display:flex;gap:8px;align-items:flex-start}
.summary .col li::before{flex:none;font-weight:800;width:14px}
.summary .can li::before{content:"✓";color:var(--ok)}
.summary .cannot li{color:var(--muted)}
.summary .cannot li::before{content:"–";color:var(--muted)}
.roledefs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.roledef{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.roledef .h{display:flex;justify-content:space-between;align-items:start;gap:10px}
.roledef h3{font-size:16px}
.roledef p{font-size:14.5px}
.roledef .linkbtn{align-self:flex-start;font-size:13.5px;margin-top:auto}
.hexgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.hex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-decoration:none;color:var(--text);display:grid;gap:4px}
.hex:hover{border-color:var(--primary)}
.hex b{font-size:15px}
.hex span{font-size:13px;color:var(--muted)}
.hex.off{opacity:.4;pointer-events:none;border-style:dashed}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.type{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.type h3{font-size:15.5px}
.type p{font-size:14px;color:var(--muted);margin-top:6px}
.type .chip{margin-top:10px}

/* ---------- component picker ---------- */
.cpick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;margin-top:18px;align-items:start}
.cpick .needs{display:grid;gap:6px}
.cpick input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);padding:0 12px;font:inherit;font-size:14px;margin-bottom:6px}
.cpick input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--soft-2)}
.cpick button.need{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;cursor:pointer}
.cpick button.need:hover{border-color:var(--primary)}
.cpick button.need:focus-visible{outline:3px solid var(--green)}
.cpick button.need[aria-pressed=true]{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.cpick button.need small{font-size:12px;font-weight:600;color:var(--muted);text-align:right;max-width:45%}
.cpick button.need[aria-pressed=true] small{color:var(--green)}
.cdetail{position:sticky;top:calc(var(--topbar) + 20px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cdetail .hd{background:var(--ink);color:var(--on-dark);padding:18px 20px}
.cdetail .hd .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:700}
.cdetail .hd h3{font-size:22px;margin-top:4px}
.cdetail .hd p{font-size:14px;color:var(--muted-on-dark);margin-top:6px}
.cdetail .bd{padding:18px 20px;display:grid;gap:14px}
.cdetail .row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.cdetail .row .i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px}
.cdetail .row .i.ok{background:var(--ok-soft);color:var(--ok)}
.cdetail .row .i.no{background:var(--bad-soft);color:var(--bad)}
.cdetail .row .i.tip{background:var(--soft);color:var(--link)}
.cdetail .row h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cdetail .row p{font-size:15px;margin-top:2px}
.viewtoggle{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface);margin-top:14px}
.viewtoggle button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.viewtoggle button[aria-pressed=true]{background:var(--ink);color:var(--green)}

/* ---------- quiz ---------- */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:18px}
.quiz .qh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.quiz .qh .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.quiz .dots{display:flex;gap:6px}
.quiz .dots i{width:26px;height:6px;border-radius:999px;background:var(--line)}
.quiz .dots i.cur{background:var(--primary)}
.quiz .dots i.right{background:var(--ok)}
.quiz .dots i.wrong{background:var(--bad)}
.quiz .qb{padding:22px 20px}
.quiz fieldset{border:0;margin:0;padding:0}
.quiz legend{font-size:19px;font-weight:700;line-height:1.3;padding:0;text-wrap:balance}
.quiz .opts{display:grid;gap:8px;margin-top:16px}
.quiz label{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;font-size:15px;transition:border-color .15s,background .15s}
.quiz label:hover{border-color:var(--primary)}
.quiz input{position:absolute;opacity:0;pointer-events:none}
.quiz .let{width:28px;height:28px;border-radius:8px;border:1px solid var(--line-2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.quiz input:focus-visible+label{outline:3px solid var(--green);outline-offset:2px}
.quiz input:checked+label{border-color:var(--primary);background:var(--soft)}
.quiz input:checked+label .let{background:var(--primary);border-color:var(--primary);color:#fff}
.quiz label.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz label.right .let{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.quiz label.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quiz label.wrong .let{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.quiz label .res{font-size:12.5px;font-weight:700}
.quiz label.right .res{color:var(--ok)}
.quiz label.wrong .res{color:var(--bad)}
.quiz .fb{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:14.5px;display:grid;gap:4px}
.quiz .fb.ok{background:var(--ok-soft);border:1px solid var(--ok-line)}
.quiz .fb.no{background:var(--bad-soft);border:1px solid var(--bad-line)}
.quiz .fb b{font-size:15px}
.quiz .qf{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.quiz .qf .note{font-size:12.5px;color:var(--muted)}
.quiz .result{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.quiz .result h3{font-size:22px}
.quiz .result p{margin-top:6px;color:var(--muted)}
.quiz .review{margin-top:18px;display:grid;gap:8px}
.quiz .review a{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text)}
.quiz .review a:hover{border-color:var(--primary)}
.quiz .review .m{flex:none;font-weight:800}
.quiz .review .m.ok{color:var(--ok)}
.quiz .review .m.no{color:var(--bad)}

/* ---------- guided walkthrough ---------- */
.walk{min-height:calc(100vh - var(--topbar));display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;background:var(--bg)}
.walk .wtop{background:var(--c-band);color:var(--c-text);border-bottom:1px solid var(--c-line)}
.walk .wtop .in{max-width:1160px;margin:0 auto;padding:16px 32px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.walk .wtop .row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.walk .wtop .t{font-weight:700}
.walk .wtop .t small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-accent);font-weight:700}
.segs{display:flex;gap:4px}
.segs button{all:unset;flex:1 1 0;min-width:0;height:8px;border-radius:999px;background:var(--c-line);cursor:pointer;position:relative}
.segs button::after{content:"";position:absolute;inset:-8px 0}
.segs button.done{background:var(--done)}
.segs button.cur{background:var(--c-text)}
.segs button:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.walk .wbody{max-width:1160px;width:100%;margin:0 auto;padding:32px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
.walk .wlist{list-style:none;padding:0;margin:0;display:grid;gap:2px;position:sticky;top:calc(var(--topbar) + 20px)}
.walk .wlist li{margin:0}
.walk .wlist .part{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:12px 10px 4px}
.walk .wlist button{all:unset;position:relative;box-sizing:border-box;width:100%;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--muted);line-height:1.3}
.walk .wlist button:hover{background:var(--surface)}
.walk .wlist button:focus-visible{outline:3px solid var(--green)}
.walk .wlist button[aria-current=step]{background:var(--surface);color:var(--text);font-weight:700;border-radius:0 8px 8px 0}
.walk .wlist button[aria-current=step]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.walk .wlist .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.walk .wlist .done .d{background:var(--green);border-color:var(--green);color:var(--ink)}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.screen .bar2{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.screen .bar2 .dots{display:flex;gap:6px}
.screen .bar2 .dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.screen .bar2 .addr{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen .sb{padding:30px 32px 32px}
.screen .sb .k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--link)}
.screen .sb h2{font-size:clamp(24px,3vw,32px);letter-spacing:-.02em;margin-top:8px}
.screen .sb .do{margin-top:22px;display:grid;gap:10px;list-style:none;padding:0;counter-reset:d}
.screen .sb .do>li{margin:0;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;font-size:16.5px;counter-increment:d}
.screen .sb .do>li::before{content:counter(d);width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--link);display:grid;place-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.screen .sb .do ul{grid-column:2;margin-top:6px;font-size:15px}
.screen .sb .why{font-size:15px;padding:12px 14px;border-radius:10px;background:var(--ok-soft);border:1px solid var(--ok-line);margin-top:24px}
.resume .ring{--ring-bg:var(--c-card)}
.walk .wfoot{background:var(--surface);border-top:1px solid var(--line);position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.walk .wfoot .in{max-width:1160px;margin:0 auto;padding:14px 32px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.walk .wfoot .hint{font-size:12.5px;color:var(--muted)}
.walk .wfoot kbd{font-family:var(--font);font-size:11px;font-weight:700;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px}
.walk .wfoot .r{display:flex;gap:8px}
.finish{text-align:center;padding:40px 24px;display:grid;justify-items:center;gap:14px}
.finish h2{font-size:30px;letter-spacing:-.02em}
.finish p{color:var(--muted);max-width:52ch}
.finish .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.enter{animation:enter .28s ease both}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- pager, toast, misc ---------- */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;color:var(--text);border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px 16px;display:grid;gap:4px}
.pager a:hover{border-color:var(--primary)}
.pager .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pager .t{font-weight:700}
.pager a.next{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--on-dark);border:1px solid var(--line-dark);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.confirm{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px}

/* ---------- video library ---------- */
.vtools{display:grid;gap:12px;margin-top:22px}
.vtools input{width:100%;max-width:420px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);padding:0 12px;font:inherit;font-size:14px}
.vtools input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--soft-2)}
.vhead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.vhead h2{font-size:24px;letter-spacing:-.01em}
.vprog{display:grid;gap:2px;text-align:right;font-size:13px;font-weight:600}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px;align-items:start}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:calc(var(--topbar) + 24px)}
.vthumb{position:relative;display:block;aspect-ratio:16/6;max-width:100%;background:var(--ink);color:var(--on-dark);text-decoration:none;border-bottom:3px solid var(--vaccent)}
.vthumb .vs{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted-on-dark)}
.vthumb .vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--vaccent);color:var(--ink);display:grid;place-items:center;transition:transform .15s}
.vthumb .vplay svg{width:18px;height:18px;margin-left:2px}
.vthumb:hover .vplay{transform:translate(-50%,-50%) scale(1.08)}
.vthumb .vd{position:absolute;right:12px;bottom:10px;font-size:12px;font-weight:700;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:5px}
.vbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.vbody h3{font-size:17px}
.vbody>p{font-size:14.5px;color:var(--muted)}
.vbody details{border-top:1px solid var(--line);padding-top:10px}
.vbody summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--link)}
.vlearn{margin-top:10px;font-size:14px}
.vchap{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:4px;font-size:14px}
.vchap li{margin:0;display:grid;grid-template-columns:48px 1fr;gap:8px}
.vchap span{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:1px}
.vfoot{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.vbadge{font-size:11px;font-weight:700;color:var(--c-muted)}
.mcard.vser{border-top:3px solid var(--vaccent)}

/* ---------- restart dialog + undo bar ---------- */
.modal-back{position:fixed;inset:0;z-index:150;background:rgba(10,13,18,.62);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;width:100%;max-width:500px;padding:24px;box-shadow:0 24px 64px rgba(0,0,0,.4);display:grid;gap:14px;animation:enter .2s ease both}
.modal h2{font-size:22px;letter-spacing:-.01em}
.modal p{font-size:15px;color:var(--muted)}
.modal p b{color:var(--text)}
.modal fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
.modal fieldset label{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer}
.modal fieldset label:hover{border-color:var(--primary)}
.modal input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--primary)}
.modal fieldset label span{display:grid;gap:2px;font-size:14.5px}
.modal fieldset label small{font-size:12.5px;color:var(--muted)}
.modal .mnote{font-size:13px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.resetbar{background:var(--soft);border-bottom:1px solid var(--soft-2);color:var(--text)}
.resetbar .in{max-width:1160px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14.5px;font-weight:600}
.resetbar .in>svg{width:18px;height:18px;color:var(--link);flex:none}
.resetbar .grow{flex:1}
@media (max-width:860px){.resetbar .in{padding-inline:16px}}

/* ---------- limited access, Q&As ---------- */
.matrix .p span{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--primary);background:linear-gradient(90deg,var(--primary) 50%,transparent 50%);vertical-align:middle}
.matrix .p.col-on span{border-color:var(--ok);background:linear-gradient(90deg,var(--ok) 50%,transparent 50%)}
.mlegend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:10px;font-size:13px;color:var(--muted)}
.mlegend span{display:inline-flex;align-items:center;gap:8px}
.mlegend i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800}
.mlegend i.y{background:var(--primary);color:#fff}
.mlegend i.p{border:2px solid var(--primary);background:linear-gradient(90deg,var(--primary) 50%,transparent 50%)}
.mlegend i.n{color:var(--line-2);font-size:16px}
.qah{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qalist{display:grid;gap:12px;margin-top:16px}
.qaitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:8px}
.qaitem h3{font-size:16.5px}
.qaitem p{font-size:15px;max-width:72ch}
.qalink{font-size:14px;font-weight:600;justify-self:start}

/* ---------- modal shell (access map, certificate, progress) ---------- */
body.modal-open{overflow:hidden}
.modal{max-height:calc(100vh - 32px);overflow:auto}
.modal.wide{max-width:1040px}
.mhd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.mhd h2{margin-top:4px}
.mhd p{margin-top:6px;max-width:64ch}
.iconbtn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--primary)}
.iconbtn svg{width:18px;height:18px}
.mft{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.mft .hint{font-size:12.5px}
.mft kbd{font-family:var(--font);font-size:11px;font-weight:700;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px}
.amap-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.amap-cmp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--muted)}
.amap-cmp select{height:36px;max-width:100%;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);padding:0 12px;font:inherit;font-size:14px}
.amap-cta{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:16px 18px;border-radius:var(--radius);background:var(--soft);border:1px solid var(--soft-2)}
.amap-cta>div{display:grid;gap:2px;font-size:14.5px}
.amap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.amap-roles{display:grid;gap:6px}
.amap-roles button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;color:var(--text)}
.amap-roles button:hover{border-color:var(--primary)}
.amap-roles button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.amap-roles button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--on-dark)}
.amap-roles button.cmp{border-style:dashed;border-color:var(--muted)}
.amap-roles .nm{font-size:14px;font-weight:700;line-height:1.25}
.amap-roles .rp{font-size:12px;font-weight:700;color:var(--muted)}
.amap-roles button[aria-pressed=true] .rp{color:var(--green)}
.amap-roles .rb{grid-column:1/-1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.amap-roles .rb i{display:block;height:100%;background:var(--primary);border-radius:inherit;transition:width .3s}
.amap-roles button[aria-pressed=true] .rb{background:var(--line-dark)}
.amap-roles button[aria-pressed=true] .rb i{background:var(--green)}
.amap-main{display:grid;gap:14px;min-width:0}
.amap-who{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.amap-who>div:first-child{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.amap-who h3{font-size:22px;letter-spacing:-.01em}
.amap-score{display:grid;text-align:right;line-height:1.1}
.amap-score b{font-size:30px;font-weight:800;color:var(--link)}
.amap-score span{font-size:12px;color:var(--muted)}
.amap-sum{font-size:15.5px;margin-top:8px;max-width:70ch}
.amap-vs{font-size:14px;color:var(--muted);margin-top:6px}
.amap-vs b{color:var(--text)}
.amap-vs .sw{display:inline-block;vertical-align:-2px;margin-right:6px;width:14px;height:14px;border-radius:4px;border:2px dashed var(--muted)}
.lane{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.lane-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lane-h h4{font-size:15px}
.lane-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--link);border:1px solid var(--soft-2)}
.lane-badge.lim{background:var(--amber-soft);color:var(--amber-ink);border-color:var(--amber-line)}
.lane-badge.none{background:transparent;color:var(--muted);border-color:var(--line-2)}
.track{list-style:none;padding:0;margin:14px 0 2px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.st{margin:0;position:relative;display:grid;justify-items:start;align-content:start;gap:3px;padding-right:8px}
.st::before{content:"";position:absolute;top:13px;left:28px;right:0;height:3px;border-radius:2px;background:var(--line)}
.st:last-child::before{display:none}
.st.link::before{background:var(--primary)}
.st .node{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line-2);background:var(--surface);color:#fff}
.st .node svg{width:15px;height:15px}
.st.lv2 .node{background:var(--primary);border:2px solid var(--primary)}
.st.lv1 .node{border:2px solid var(--primary);background:linear-gradient(90deg,var(--primary) 50%,var(--surface) 50%)}
.st .sl{font-size:13.5px;font-weight:700;margin-top:4px;line-height:1.25}
.st.lv0 .sl{color:var(--muted);font-weight:600}
.st .sv{font-size:12px;font-weight:600;color:var(--muted)}
.st.lv2 .sv{color:var(--link)}
.st.lv1 .sv{color:var(--amber-ink)}
.st .cv{display:inline-block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:4px;padding:1px 7px;border:1.5px dashed var(--line-2);border-radius:6px}
.st .cv.diff{color:var(--text);font-weight:700;border-color:var(--muted)}
.amap-note{font-size:13px}
.cert-lock{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius);background:var(--soft);border:1px solid var(--soft-2)}
.cert-lock>svg{width:22px;height:22px;flex:none;color:var(--link);margin-top:2px}
.cert-lock>div{display:grid;gap:4px;font-size:14.5px}
.cert-left{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.cert-left li{margin:0;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.cert-left .d{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:800}
.cert-left li.ok .d{background:var(--done);border-color:var(--done);color:var(--ink)}
.cert-left .d svg{width:13px;height:13px}
.cert-left .muted{font-size:12.5px}
.cert-form{display:grid;gap:6px}
.cert-form label{font-size:13.5px;font-weight:700}
.cert-form input{height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);padding:0 14px;font:inherit;font-size:16px;max-width:460px}
.cert-form input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--soft-2)}
.cert-prev{border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);background:#F8F8F8}
.cert-prev canvas{display:block;width:100%;height:auto}
.certready{border-color:var(--green)!important}
.certready .t{display:flex;align-items:center;gap:8px}
.certready .t svg{width:18px;height:18px;color:var(--green)}
.modal textarea{width:100%;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical;word-break:break-all}
.modal textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--soft-2)}
.perr{font-size:14px;color:var(--bad);font-weight:600}
.navbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:14.5px;color:var(--c-text);line-height:1.3;cursor:pointer}
.navbtn:hover{background:var(--c-hover)}
.navbtn:focus-visible{outline:3px solid var(--green)}
.navbtn .tail{margin-left:auto;display:flex}
.lockic{color:var(--c-muted);display:grid}
.lockic svg{width:16px;height:16px}
@media (max-width:860px){
  .amap{grid-template-columns:minmax(0,1fr)}
  .amap-roles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .modal{padding:18px}
  .track{grid-template-columns:minmax(0,1fr);margin-top:12px}
  .st{grid-template-columns:28px auto 1fr;align-items:center;column-gap:10px;padding:0 0 14px}
  .st:last-child{padding-bottom:0}
  .st::before{top:28px;left:12.5px;right:auto;width:3px;height:calc(100% - 28px)}
  .st .sl{margin:0}
  .st .sv{justify-self:start}
  .st .cv{grid-column:2/-1;margin-top:0}
}

/* ---------- live component list ---------- */
.cl-card{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:center;margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.cl-shot{aspect-ratio:4/3;max-width:100%;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);padding:10px;display:grid;gap:6px;grid-template-rows:2fr 1fr 1fr 1fr}
.cl-shot span{border-radius:4px;background:var(--soft-2)}
.cl-shot .b1{background:var(--ink)}
.cl-shot .b3{background:linear-gradient(90deg,var(--soft-2) 48%,transparent 48%,transparent 52%,var(--soft-2) 52%)}
.cl-shot .b4{background:repeating-linear-gradient(90deg,var(--soft-2) 0 23%,transparent 23% 25.6%)}
.cl-body{display:grid;gap:8px;justify-items:start}
.cl-body h3{font-size:18px}
.cl-body p.muted{font-size:14px;max-width:62ch}
.cltable td{font-size:14px}
.cl-diff{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:12.5px;color:var(--amber-ink);font-weight:600}
.cl-diff svg{width:14px;height:14px;flex:none;margin-top:2px}
.cl-link{margin-top:12px}
.cl-mini{font-size:13.5px;font-weight:600}
@media (max-width:860px){.cl-card{grid-template-columns:minmax(0,1fr)}.cl-shot{max-width:220px}}

@media (max-width:1100px){
  .with-toc{grid-template-columns:minmax(0,1fr)}.toc{display:none}
  .grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .types{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summary{grid-template-columns:1fr 1fr}.summary .who{grid-column:1/-1}
  .pathlist a{grid-template-columns:44px minmax(0,1fr) 140px}
  .pathlist .go{display:none}
}
@media (max-width:1000px){
  .panels{grid-template-columns:1fr}
  .grid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr)}
  .footer .page{grid-template-columns:1fr 1fr}
  .walk .wbody{grid-template-columns:minmax(0,1fr)}.walk .wlist{display:none}
  .cpick{grid-template-columns:minmax(0,1fr)}.cdetail{position:static}
  .pagemock{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidenav{position:fixed;left:0;top:calc(var(--topbar) + env(safe-area-inset-top,0px));bottom:0;width:min(310px,86vw);transform:translateX(-102%);transition:transform .22s ease;z-index:60;height:auto;visibility:hidden}
  .sidenav.open{transform:none;visibility:visible}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  .menu-btn{display:inline-flex}
  .brand .site,.brand .div,.hub-link,.top-progress{display:none}
  .mode-btn b{display:none}
  .search{width:auto;flex:1}
  .search kbd{display:none}
  .topbar{padding-inline:16px;gap:12px}
  .page{padding:28px 16px 64px}
  .band .page{padding-block:28px 32px}
  .walk .wtop .in,.walk .wbody,.walk .wfoot .in{padding-inline:16px}
  .walk .wfoot .hint{display:none}
  .walk .wfoot [data-walk=skip]{display:none}
  .walk .wfoot .btn{padding:0 14px;font-size:14px}
  .screen .sb{padding:22px 18px 24px}
  .mhead{grid-template-columns:minmax(0,1fr)}.mhead .prog{justify-items:start;grid-auto-flow:column;align-items:center;text-align:left}
  .vgrid,.grid.c3,.grid.c2,.grid.c4,.good-bad,.qlist,.hexgrid,.roledefs,.types,.footer .page,.pager,.summary,.tips ul,.stats{grid-template-columns:minmax(0,1fr)}
  .pathlist a{grid-template-columns:40px minmax(0,1fr)}
  .pathlist .pg{grid-column:2}
  .step{grid-template-columns:36px minmax(0,1fr);padding:14px}
  .step .check{grid-column:2;justify-self:start}
}
@media (max-width:480px){.brand .wm{display:none}.brand .im{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

<script>
/* =====================================================================
   HOW TO EDIT THIS SITE  —  read me first
   =====================================================================
   This is a single static HTML file. There is no build step: edit this
   file, save it, commit, push — GitHub Pages redeploys automatically
   (usually within about a minute).

   Everything a person reads on the site lives in the JavaScript objects
   below: ROLES, MATRIX, PAGE_TYPES, MODULES, ROLE_VIEWS, QUESTIONS,
   GUIDES, (v2) QUIZZES — the knowledge-check questions — and (v2.2)
   VIDEO_SERIES / VIDEOS — the video library, with instructions above it.
   The HTML/CSS above never needs to change for a content update — only
   these objects do.

   MOST COMMON EDITS
     - Answering an open question: find the QA array, change the item's
       answer text (a:[...]) and its group's status ('answered',
       'partial' or 'open'). If a matching entry in QUESTIONS has
       soon:true or partial:true, remove that flag.
     - Changing who can do what: edit MATRIX. The second list is full
       access, the optional fourth list is limited access. The matrix,
       the permission explorer and the access profile chart all update.
     - Access map lanes (Roles → Open access map): ACCESS_LANES lists the
       areas and their stages; each stage points at a MATRIX row label.
     - Adding steps to a module: add them at the END of its steps array
       (learners' progress is stored by step position).

   ANATOMY OF A STEP (used throughout GUIDES.*.steps):
     { t:'Step title',            // shown as the step heading
       screen:'Where in the CMS', // shown as the small "Screen:" chip
       b:['First instruction','Second instruction'], // bullet list
       why:'Optional one-line payoff, shown in green' }

   LIGHT / DARK MODE: dark is the default. The toggle in the top bar
   switches modes and remembers the choice in the learner's browser
   (localStorage key "rec-mode"). Colours are tokens at the top of the
   <style> block: :root is dark, :root[data-mode="light"] is light.

   PROGRESS (v2): learners' ticked steps and quiz scores are saved only
   in their own browser (localStorage key "rec-training-v2"). Step keys
   are positional ('step-1', 'step-2'…), so if you insert a step in the
   middle of a module, people who already ticked later steps will see
   their ticks shift by one. Add new steps at the end where you can.

   ADDING A WHOLE NEW MODULE later:
     - Add an entry to MODULES (pick the next number, an id, title,
       one-line blurb, and which role ids can do it).
     - Add a matching entry to GUIDES using the same id as the key.
     - Add it to the relevant role(s) in ROLE_VIEWS if it should show
       up on someone's "your modules" list.
     - Add a row to MATRIX if it affects the roles × modules table.
     - Optionally add a knowledge check for it in QUIZZES.
     - The side nav, learning paths, progress, guided walkthrough,
       search index and pager all read from these objects automatically.

   Role ids you can use anywhere: super, cmmu, kca, kcm, nea, nem,
   authenticated — see the ROLES array for what each one means.
   ===================================================================== */

const ROLES = [
  {id:'authenticated', name:'Authenticated User', kind:'auth', desc:'Can access and use the site for their own activity — including viewing content, creating and managing their own proposals and profile, saving favourites, and managing their own submissions and notifications — but cannot edit others’ content or access admin features.'},
  {id:'super', name:'Super User', desc:'Administrator elevated access to manage the DSP solution, including global content editing, update/creation of structural components and creating/editing/removing all other roles and their associated permissions. This role is restricted to a member of the Capgemini DSP team and RECCo IT.'},
  {id:'kca', name:'Knowledge Content Analyst', alias:'Content Editor', desc:'A content publisher role with all permissions of the Knowledge Analyst, however can also publish Knowledge Centre content.'},
  {id:'kcm', name:'Knowledge Content Manager', alias:'Content Publisher', desc:'A publisher role with all permissions of the Assurance Analyst, however can also publish Assurance content.'},
  {id:'nea', name:'News & Events Analyst', alias:'Content Editor', desc:'A content editor role, restricted to creating/updating/deleting News & Events content.'},
  {id:'nem', name:'News & Events Manager', alias:'Content Publisher', desc:'A content publishing role, restricted to publishing new/updated/deleted News & Events content.'},
  {id:'cmmu', name:'Code Manager Master User', desc:'An administrator level role, with all Code Manager permissions plus the ability to assign other Code Manager roles to users.'}
];
const MATRIX_COLS = ['super','cmmu','kca','kcm','nea','nem','authenticated'];
/* MATRIX rows: [label, roles with access, guide id, roles with LIMITED access]
   Limited = the lighter shading in the deck's matrix (slide 11). */
const MATRIX = [
  ['Search & manage existing pages', ['super','cmmu'], 'search', ['kca','kcm','nea','nem']],
  ['Create a new Portal page', ['super','cmmu'], 'create-page'],
  ['Upload media to the library', ['super','cmmu'], 'media', ['kcm','nem']],
  ['Publish Portal page', ['super','cmmu'], 'publish'],
  ['Create wiki page', ['super','cmmu','kca','kcm'], 'wiki'],
  ['Publish wiki page', ['super','cmmu','kcm'], 'wiki'],
  ['Create event, news', ['super','cmmu','nea','nem'], 'events'],
  ['Publish event, news, bulletins', ['super','cmmu','nem'], 'news'],
  ['Portal pages administration', ['super','cmmu'], 'admin'],
  ['View pages, wiki, events, news', MATRIX_COLS, null]
];
/* ACCESS MAP lanes (Roles page → Open access map). Each stage is
   [label shown, MATRIX row label it reads from]. Stages run left to right
   from least to most access. short/noun are used in the summary sentence. */
const ACCESS_LANES = [
  {area:'Portal pages', short:'Portal pages', noun:'Portal pages', stages:[['View','View pages, wiki, events, news'],['Search & manage','Search & manage existing pages'],['Create','Create a new Portal page'],['Publish','Publish Portal page']]},
  {area:'Wiki pages', short:'wiki pages', noun:'wiki pages', stages:[['View','View pages, wiki, events, news'],['Create','Create wiki page'],['Publish','Publish wiki page']]},
  {area:'Events, news & bulletins', short:'events, news & bulletins', noun:'events, news & bulletins', stages:[['View','View pages, wiki, events, news'],['Create','Create event, news'],['Publish','Publish event, news, bulletins']]},
  {area:'Media library', short:'the media library', noun:'the media library', stages:[['Upload','Upload media to the library']]},
  {area:'Portal administration', short:'the Portal (menus, visibility, revisions, taxonomies)', noun:'Portal administration', stages:[['Administer','Portal pages administration']]}
];
/* LIVE COMPONENT LIST — the CMS's own gallery of every component, with
   the image sizes the build expects. Pre-production address: update url
   at go-live. Sizes read from the page on 5 Oct 2026. deck = what the
   training pack says, where it differs. */
const COMPONENT_LIST = {
  url:'https://reccopreprod.prod.acquia-sites.com/components/lists/all',
  env:'Pre-production',
  checked:'5 October 2026',
  items:[
    {name:'Hero Image', size:'1600 × 800', note:'Large header with search, quick access links and "Provided by"', deck:'The deck calls this the Hero Banner (1600 × 800px)'},
    {name:'Hero Banner', size:'1368 × 280', note:'Shorter banner image for a section or page header'},
    {name:'Hero Image Card Split with Search', size:'826 × 549', note:'Image and text side by side with a search box'},
    {name:'Image Card Split', size:'720 × 448', note:'Main image plus a list with white SVG icons (16 × 16)'},
    {name:'External Services', size:'688 × 400', note:'Left- and right-image variants'},
    {name:'Image Card Section', size:'405 × 125', note:'Row of image cards', deck:'The deck says about 370 × 240px'},
    {name:'Small Card', size:'', note:'Headline and link, e.g. Change Management, Digital REC'},
    {name:'Split Textbox', size:'', note:'Description with cards, buttons and an information message'},
    {name:'Section Header', size:'', note:'Breadcrumb, title, Help and a button'},
    {name:'Section Description', size:'', note:'Short introductory text'},
    {name:'Accordion', size:'', note:'Collapsible blocks for long or dense content'},
    {name:'Column Link Layout', size:'', note:'Up to three columns of links'},
    {name:'Quick tabs', size:'', note:'Tabbed content, with a grey background variant'},
    {name:'Document table', size:'', note:'Files with type, size, last updated, download and copy link'},
    {name:'Record table: DNO layout', size:'', note:'Records with version, upload date and View'},
    {name:'Record table: Publication layout', size:'', note:'Date of publication, title, organisation and View'},
    {name:'Video table', size:'', note:'Videos with a short description, upload date and Watch'}
  ]
};
const PAGE_TYPES = [
  ['Portal page','Free format — can use any components, no defined structure; the author has freedom to implement their own design. Role restricted: only elevated roles are permitted to create Portal pages.'],
  ['Wiki page','Pre-defined structure. Content update only, without the ability to implement custom page designs.'],
  ['Events page','Structured event record shown on the front-end Events Calendar (title, category, date/time, location or link, organiser).'],
  ['News page','News Articles and Podcasts share one content form (title, category, teaser, main content, image or YouTube video). They publish to News and Podcasts in the Knowledge Centre, grouped by category.']
];

const KEY='rec-training-v2';

if(!Array.isArray(S.watched)) S.watched=[];

/* ---------- progress model ---------- */
function itemsOf(id){
  const g=GUIDES[id]; if(!g||g.soon) return [];
  if(g.parts) return g.parts.flatMap(p=>p.steps.map((s,i)=>({key:`${p.id}-${i+1}`,s,part:p.title,n:i+1})));
  if(g.tricksList) return g.tricksList.map((t,i)=>({key:`trick-${i+1}`,s:{t:t.what,screen:'Useful trick · '+t.area,b:[t.how]},n:i+1}));
  return (g.steps||[]).map((s,i)=>({key:`step-${i+1}`,s,n:i+1}));
}
const isDone=(id,key)=>(S.steps[id]||[]).includes(key);
function setDone(id,key,on){
  const a=new Set(S.steps[id]||[]); on?a.add(key):a.delete(key); S.steps[id]=[...a]; save();
}
function prog(id){
  const items=itemsOf(id); const q=QUIZZES[id];
  const total=items.length+(q?1:0);
  const done=items.filter(x=>isDone(id,x.key)).length+(q&&S.quiz[id]?.passed?1:0);
  return {total,done,pct:total?Math.round(done/total*100):0,stepsDone:items.filter(x=>isDone(id,x.key)).length,steps:items.length,quiz:!!q,passed:!!S.quiz[id]?.passed};
}
function pathIds(){
  const v=ROLE_VIEWS.find(r=>r.id===S.role);
  return v?MODULES.filter(m=>v.mods.includes(m.id)).map(m=>m.id):MODULES.map(m=>m.id);
}
const inPath=id=>pathIds().includes(id);
const optIds=()=>(ROLE_VIEWS.find(r=>r.id===S.role)||{}).optional||[];
const isOpt=id=>optIds().includes(id);
function pathCourse(){ const v=ROLE_VIEWS.find(r=>r.id===S.role); return v&&v.course?v.course:''; }
function overall(){
  let t=0,d=0,mods=0,modsDone=0,steps=0,checks=0;
  pathIds().forEach(id=>{ if(modOf(id).soon||isOpt(id)) return; const p=prog(id); t+=p.total; d+=p.done; mods++; if(p.total&&p.done===p.total) modsDone++; steps+=p.stepsDone; if(p.passed) checks++; });
  return {pct:t?Math.round(d/t*100):0,mods,modsDone,steps,checks};
}
function nextUp(){
  for(const id of pathIds()){
    if(modOf(id).soon||isOpt(id)) continue;
    const items=itemsOf(id); const u=items.find(x=>!isDone(id,x.key));
    if(u) return {id,item:u,label:`Step ${items.indexOf(u)+1} of ${items.length}: ${u.s.t}`,href:`#/guide/${id}/walk#${u.key}`};
    if(QUIZZES[id]&&!S.quiz[id]?.passed) return {id,label:'Knowledge check',href:`#/guide/${id}#quiz`};
  }
  return null;
}

function exploreSummary(){

function applyExplore(){

function moduleHead(id){
  const g=GUIDES[id], m=modOf(id), p=prog(id), items=itemsOf(id);

  const walkLabel=!p.stepsDone?'Start guided walkthrough':firstUndone?`Resume at step ${items.indexOf(firstUndone)+1}`:'Replay walkthrough';
  const walkHref=`#/guide/${id}/walk${firstUndone?'#'+firstUndone.key:''}`;
  const notice = S.role&&S.role!=='all'&&!inPath(id)&&id!=='roles'?`<div class="notice">${I.info}<span>This module isn’t part of your role’s learning path. You can still read it, but you may not have permission to do this in the CMS.</span></div>`:'';
  return `<div class="band on-dark"><div class="page">${crumbs('<a href="#/">Modules</a>',esc(g.title))}
    <div class="mhead"><div><div class="eyebrow">Module ${m.n}${g.soon?' · Coming soon':''}</div><h1 class="title">${esc(g.title)}</h1><p class="lede">${esc(g.lede)}</p>
      <div class="meta"><span>For:</span>${chips(g.roles)}</div>
      ${g.soon?'':`<div class="meta"><span><b>${items.length}</b> ${g.tricksList?'trick':'steps'}</span>${QUIZZES[id]?`<span><b>${QUIZZES[id].length}</b>-question knowledge check</span>`:''}<span data-status="${id}">${statusText(p)}</span></div>
      <div class="actions"><a class="btn btn-green" href="${walkHref}">${I.play}${walkLabel}</a>${QUIZZES[id]?`<a class="btn btn-ghost" href="#quiz">${p.passed?'Knowledge check passed':'Take the knowledge check'}</a>`:''}<button type="button" class="btn btn-ghost" data-action="reset-module" data-mod="${id}" ${p.done?'':'hidden'}>${I.restart}Restart this module</button></div>`}
      ${notice}</div>
      ${g.soon?'':`<div class="prog"><span data-ring="${id}">${ring(p.pct,'lg')}</span><span data-count="${id}">${p.done} of ${p.total} complete</span></div>`}
    </div></div></div>`;
}
function renderGuide(id){
  const g=GUIDES[id], m=modOf(id);
  if(!g||!m) return renderNotFound();
  const head=moduleHead(id);
  if(g.soon){
    return head+`<div class="page narrow"><section class="section" id="soon"><div class="callout warn">${I.info}<div><b>Content in progress.</b> This section exists in the training pack but its steps have not been written yet. Until then, News &amp; Events Analysts and Managers create news content through REC Admin using the same Draft → Needs Review → Published workflow as events; the role matrix on the <a href="#/roles#explore">Roles &amp; permissions</a> page shows who can create and publish.</div></div>
    <h3 class="sub">What this module will cover</h3>${list(['How to create, edit and delete a News page (News & Events Analyst)','How to publish News content (News & Events Manager)','Podcasts: adding audio content and show notes','How news surfaces on the Portal home and in search'])}</section>${pager(id)}</div>`;
  }
  const p=prog(id); let body='', toc=[];
  if(g.tricksList){
    body=`<section class="section" id="list"><h2>Tricks</h2><p class="sub-l">Try each one in the CMS, then tick it off.</p><div class="tbl-wrap"><table><thead><tr><th scope="col">#</th><th scope="col">Area</th><th scope="col">What</th><th scope="col">How</th><th scope="col"><span class="sr">Status</span></th></tr></thead><tbody>${g.tricksList.map((t,i)=>`<tr><td class="tnum">${i+1}</td><td><b>${esc(t.area)}</b></td><td>${esc(t.what)}</td><td>${esc(t.how)}</td><td>${checkBtn(id,'trick-'+(i+1),t.what)}</td></tr>`).join('')}</tbody></table></div>
      <div class="callout">${I.info}<div>Have a trick of your own? <b>Send it to the team</b> and it will be added to this list with your name against it.</div></div></section>`;
    toc.push(['list','Tricks',p.stepsDone===p.steps]);
  } else if(g.parts){
    body=g.parts.map(pt=>{const its=itemsOf(id).filter(x=>x.key.startsWith(pt.id+'-'));return `<section class="section" id="${pt.id}"><h2>${esc(pt.title)}</h2><div style="margin-top:12px">${chips(pt.roles)}</div><h3 class="sub">The journey</h3>${flow(pt.journey)}<h3 class="sub">Step by step</h3><ol class="steps">${its.map(it=>stepCard(id,it)).join('')}</ol>${panels(pt)}</section>`}).join('');
    toc=g.parts.map(pt=>[pt.id,pt.title,itemsOf(id).filter(x=>x.key.startsWith(pt.id+'-')).every(x=>isDone(id,x.key))]);
  } else {
