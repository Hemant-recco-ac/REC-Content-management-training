/* ---------- QUIZ ---------- */
const passMark=id=>Math.ceil(QUIZZES[id].length*0.75);
let Q=null;
function startQuiz(id,fresh){
  const prev=S.quiz[id];
  Q={id,i:0,ans:[],checked:false,showResult:!fresh&&!!prev,prev};
  drawQuiz();
}
function drawQuiz(){
  const box=$('#quizBox'); if(!box||!Q) return;
  const qs=QUIZZES[Q.id];
  if(Q.showResult){
    const r=Q.last||{score:Q.prev.score,total:Q.prev.total,passed:Q.prev.passed};
    const pct=Math.round(r.score/r.total*100);
    box.innerHTML=`<div class="quiz"><div class="qh"><span class="k">Result</span><div class="dots">${qs.map((_,i)=>`<i class="${Q.ans[i]===undefined?(r.passed?'right':''):(Q.ans[i]===qs[i].a?'right':'wrong')}"></i>`).join('')}</div></div>
      <div class="qb"><div class="result">${ring(pct,'lg',`Score ${r.score} of ${r.total}`).replace(`<span>${pct}%</span>`,`<span>${r.score}/${r.total}</span>`)}<div><h3>${r.passed?'Passed — module check complete':'Not quite — have another go'}</h3><p>${r.passed?'You got '+r.score+' of '+r.total+' right.':'You need '+passMark(Q.id)+' of '+r.total+'. Review the steps below, then retake it.'}</p></div></div>
      ${Q.ans.length?`<div class="review">${qs.map((q,i)=>`<a href="#${q.ref}"><span class="m ${Q.ans[i]===q.a?'ok':'no'}">${Q.ans[i]===q.a?'✓':'✕'}</span><span><b>${esc(q.q)}</b><br><span class="muted">${esc(q.why)}</span></span></a>`).join('')}</div>`:''}</div>
      <div class="qf"><span class="note">Questions written from the training pack content.</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-ghost btn-sm" data-quiz="retake">Retake</button>${r.passed?nextModuleBtn(Q.id):''}</div></div></div>`;
    return;
  }
  const q=qs[Q.i], sel=Q.ans[Q.i];
  box.innerHTML=`<div class="quiz"><div class="qh"><span class="k">Question ${Q.i+1} of ${qs.length}</span><div class="dots" aria-hidden="true">${qs.map((_,i)=>`<i class="${i<Q.i?(Q.ans[i]===qs[i].a?'right':'wrong'):i===Q.i?(Q.checked?(sel===q.a?'right':'wrong'):'cur'):''}"></i>`).join('')}</div></div>
    <div class="qb"><fieldset><legend>${esc(q.q)}</legend><div class="opts">${q.o.map((o,i)=>{const cls=Q.checked?(i===q.a?'right':(i===sel?'wrong':'')):'';return `<input type="radio" name="qo" id="qo${i}" value="${i}" ${sel===i?'checked':''} ${Q.checked?'disabled':''}><label for="qo${i}" class="${cls}"><span class="let">${'ABCDE'[i]}</span><span>${esc(o)}</span><span class="res">${cls==='right'?'Correct answer':cls==='wrong'?'Your answer':''}</span></label>`}).join('')}</div></fieldset>
    <div id="qfb" aria-live="polite">${Q.checked?`<div class="fb ${sel===q.a?'ok':'no'}"><b>${sel===q.a?'Correct.':'Not quite.'}</b><span>${esc(q.why)}</span><a href="#${q.ref}" style="font-size:13.5px">Review this in the module →</a></div>`:''}</div></div>
    <div class="qf"><span class="note">Pick an answer, then check it.</span>${Q.checked?`<button type="button" class="btn btn-primary" data-quiz="next">${Q.i<qs.length-1?'Next question':'See my result'}${I.right}</button>`:`<button type="button" class="btn btn-primary" data-quiz="check" ${sel===undefined?'disabled':''}>Check answer</button>`}</div></div>`;
}
function nextModuleBtn(id){
  const ids=pathIds().filter(x=>!modOf(x).soon), i=ids.indexOf(id), nx=ids[i+1];
  return nx?`<a class="btn btn-primary btn-sm" href="#/guide/${nx}">Next: ${esc(modOf(nx).title)}${I.right}</a>`:'';
}
function quizAction(a){
  const qs=QUIZZES[Q.id];
  if(a==='check'){ if(Q.ans[Q.i]===undefined) return; Q.checked=true; drawQuiz(); $('[data-quiz=next]')?.focus(); }
  else if(a==='next'){
    if(Q.i<qs.length-1){ Q.i++; Q.checked=false; drawQuiz(); $('#quizBox legend')?.scrollIntoView({block:'center'}); $('#qo0')?.focus(); }
    else{
      const score=qs.filter((q,i)=>Q.ans[i]===q.a).length, passed=score>=passMark(Q.id);
      const wasPassed=!!S.quiz[Q.id]?.passed;
      S.quiz[Q.id]={score,total:qs.length,passed:passed||wasPassed}; save();
      Q.last={score,total:qs.length,passed}; Q.showResult=true; drawQuiz(); refresh();
      toast(passed?'Knowledge check passed':'Score saved — retake any time');
      if(passed&&prog(Q.id).pct===100) setTimeout(()=>toast(`Module ${modOf(Q.id).n} complete`),2600);
    }
  }
  else if(a==='retake'){ startQuiz(Q.id,true); $('#qo0')?.focus(); }
}

/* ---------- GUIDED WALKTHROUGH ---------- */
let W=null;
function renderWalk(id,anchor){
  const g=GUIDES[id]; if(!g||g.soon) return renderGuide(id);
  const items=itemsOf(id);
  let idx=anchor==='end'?items.length:items.findIndex(x=>x.key===anchor);
  if(idx<0){ idx=items.findIndex(x=>!isDone(id,x.key)); if(idx<0) idx=0; }
  W={id,idx};
  return `<div class="walk" id="walk">${walkInner()}</div>`;
}
function walkInner(){
  const {id,idx}=W, g=GUIDES[id], m=modOf(id), items=itemsOf(id), fin=idx>=items.length, it=items[idx];
  let lastPart=null;
  const side=`<ol class="wlist" aria-label="Steps">${items.map((x,i)=>{let h='';if(x.part&&x.part!==lastPart){lastPart=x.part;h=`<li class="part">${esc(x.part)}</li>`;}return h+`<li class="${isDone(id,x.key)?'done':''}"><button type="button" data-go="${i}" ${i===idx?'aria-current="step"':''}><span class="d">${isDone(id,x.key)?'✓':x.n}</span><span>${esc(x.s.t)}</span></button></li>`}).join('')}</ol>`;
  const top=`<div class="wtop on-dark"><div class="in"><div class="row"><div class="t"><small>Module ${m.n} · Guided walkthrough</small>${esc(g.title)}</div><a class="btn btn-ghost btn-sm" href="#/guide/${id}${it?'#'+it.key:''}">${I.x}Exit walkthrough</a></div>
    <div class="segs" role="group" aria-label="Jump to step">${items.map((x,i)=>`<button type="button" data-go="${i}" class="${i===idx?'cur':isDone(id,x.key)?'done':''}" aria-label="Step ${i+1}: ${esc(x.s.t)}${isDone(id,x.key)?' (done)':''}"></button>`).join('')}</div></div></div>`;
  if(fin){
    const p=prog(id);
    return top+`<div class="wbody">${side}<div class="screen enter"><div class="finish">${ring(Math.round(p.stepsDone/p.steps*100),'lg')}<h2>${p.stepsDone===p.steps?'Walkthrough complete':'End of the walkthrough'}</h2><p>${p.stepsDone} of ${p.steps} ${g.tricksList?'tricks':'steps'} marked done.${QUIZZES[id]?' Finish the module with the knowledge check.':''}</p>
      <div class="row">${QUIZZES[id]&&!p.passed?`<a class="btn btn-primary" href="#/guide/${id}#quiz">Take the knowledge check${I.right}</a>`:''}<a class="btn btn-ghost" href="#/guide/${id}">Back to module</a>${p.passed?nextModuleBtn(id):''}</div></div></div></div>
      <div class="wfoot"><div class="in"><button type="button" class="btn btn-ghost" data-walk="prev">${I.left}Back</button><span></span></div></div>`;
  }
  const s=it.s, done=isDone(id,it.key);
  const doList=[]; s.b.forEach(b=>{ if(Array.isArray(b)&&doList.length) doList[doList.length-1].sub=b; else if(Array.isArray(b)) b.forEach(x=>doList.push({t:x})); else doList.push({t:b}); });
  return top+`<div class="wbody">${side}<article class="screen enter" aria-labelledby="wh">
    <div class="bar2"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="addr" title="${esc(s.screen||g.title)}"><span class="sr">Screen: </span>${esc(s.screen||g.title)}</span></div>
    <div class="sb"><div class="k">${it.part?esc(it.part)+' · ':''}Step ${idx+1} of ${items.length}${done?' · Done':''}</div><h2 id="wh" tabindex="-1">${esc(s.t)}</h2>
    <ol class="do">${doList.map(d=>`<li><div>${esc(d.t)}${d.sub?`<ul>${d.sub.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div></li>`).join('')}</ol>
    ${s.why?`<p class="why">${I.target}<span><b>Why it matters:</b> ${esc(s.why)}</span></p>`:''}</div></article></div>
    <div class="wfoot"><div class="in"><button type="button" class="btn btn-ghost" data-walk="prev" ${idx===0?'disabled':''}>${I.left}Back</button><span class="hint"><kbd>←</kbd> <kbd>→</kbd> to move · <kbd>D</kbd> to mark done</span>
    <div class="r"><button type="button" class="btn btn-ghost" data-walk="skip">${idx===items.length-1?'Finish':'Skip'}</button><button type="button" class="btn btn-primary" data-walk="done">${done?'Next step':(idx===items.length-1?'Mark done & finish':'Mark done & next')}${I.right}</button></div></div></div>`;
}
function walkGo(i){
  const items=itemsOf(W.id); W.idx=Math.max(0,Math.min(items.length,i));
  $('#walk').innerHTML=walkInner();
  const it=items[W.idx]; history.replaceState(null,'',`#/guide/${W.id}/walk${it?'#'+it.key:'#end'}`);
  window.scrollTo(0,0); ($('#wh')||$('.finish h2'))?.focus?.({preventScroll:true});
}
function walkAction(a){
  const items=itemsOf(W.id), it=items[W.idx];
  if(a==='prev') walkGo(W.idx-1);
  else if(a==='skip') walkGo(W.idx+1);
  else if(a==='done'){ if(it&&!isDone(W.id,it.key)){ setDone(W.id,it.key,true); refresh(); } walkGo(W.idx+1); }
  else if(a==='toggle'&&it){ const on=!isDone(W.id,it.key); setDone(W.id,it.key,on); refresh(); $('#walk').innerHTML=walkInner(); toast(on?'Step marked done':'Step unmarked'); }
}

/* ---------- RESTART TRAINING ---------- */
function hasProgress(){return Object.values(S.steps).some(x=>x&&x.length)||Object.keys(S.quiz).length>0||(S.watched||[]).length>0;}
let resetCtx=null, lastReset=null;
function openReset(scope,modId){
  closeReset();
  const stepsDone=Object.values(S.steps).reduce((n,x)=>n+(x?x.length:0),0), checks=Object.values(S.quiz).filter(q=>q&&q.passed).length, watched=(S.watched||[]).length;
  resetCtx={scope,modId,opener:document.activeElement};
  let body;
  if(scope==='module'){
    const m=modOf(modId), p=prog(modId);
    body=`<h2 id="rsTitle">Restart module ${m.n}?</h2><p>This clears your ${p.stepsDone} ticked ${p.stepsDone===1?'step':'steps'}${QUIZZES[modId]&&S.quiz[modId]?' and your knowledge check score':''} for <b>${esc(m.title)}</b>, so you can work through it again from step 1. Other modules aren’t affected.</p>`;
  } else {
    body=`<h2 id="rsTitle">Restart the training?</h2><p>This clears your progress so the training starts again from the beginning. Progress is saved in this browser only, so this won’t affect anyone else.</p>
    <fieldset><legend class="sr">What to clear</legend>
      <label><input type="checkbox" id="rsSteps" checked> <span><b>Ticked steps and knowledge checks</b><small>${stepsDone} ${stepsDone===1?'step':'steps'} done, ${checks} ${checks===1?'check':'checks'} passed</small></span></label>
      <label><input type="checkbox" id="rsVideos"> <span><b>Watched videos</b><small>${watched} marked as watched</small></span></label>
      <label><input type="checkbox" id="rsRole"> <span><b>Your chosen role</b><small>${S.role?'You’ll pick your role again on the home page':'No role chosen yet'}</small></span></label>
    </fieldset>`;
  }
  const back=document.createElement('div'); back.className='modal-back'; back.id='resetModal';
  back.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rsTitle">${body}<p class="mnote">You can undo this straight afterwards.</p>
    <div class="mfoot"><button type="button" class="btn btn-ghost" data-action="reset-cancel">Cancel</button><button type="button" class="btn btn-primary" data-action="reset-confirm">${I.restart}${scope==='module'?'Restart module':'Restart training'}</button></div></div>`;
  back.addEventListener('click',e=>{ if(e.target===back) closeReset(); });
  document.body.appendChild(back);
  (back.querySelector('input')||back.querySelector('[data-action=reset-confirm]')).focus();
}
function closeReset(){ if($('#resetModal')) closeAnyModal(); }
function doReset(){
  if(!resetCtx) return;
  const backup=JSON.parse(JSON.stringify(S)); let label, goHome=false;
  if(resetCtx.scope==='module'){
    const id=resetCtx.modId; delete S.steps[id]; delete S.quiz[id]; delete S.completedAt; label=`Module ${modOf(id).n} restarted.`;
  } else {
    const st=$('#rsSteps')?.checked, vd=$('#rsVideos')?.checked, rl=$('#rsRole')?.checked;
    if(!st&&!vd&&!rl){ toast('Choose at least one thing to clear'); return; }
    if(st){ S.steps={}; S.quiz={}; delete S.completedAt; } if(vd) S.watched=[]; if(rl) S.role=null;
    label='Training restarted.'; goHome=true;
  }

const rowByLabel=l=>MATRIX.find(r=>r[0]===l);

function reachOf(role){ let got=0,max=0; ACCESS_LANES.forEach(l=>l.stages.forEach(([name,lab])=>{ if(lab==='View pages, wiki, events, news') return; max+=2; got+=stageLevel(lab,role); })); return {got,max,pct:Math.round(got/max*100)}; }
function laneTop(lane,role){ let top=null; lane.stages.forEach(([name,lab])=>{ const v=stageLevel(lab,role); if(v) top={name,v}; }); return top; }
function roleSentence(role){
  const verbs={'View':'view','Search & manage':'search and manage','Create':'create','Publish':'publish','Upload':'upload to','Administer':'administer'};
  const groups=[], none=[];
  ACCESS_LANES.forEach(l=>{ const t=laneTop(l,role); if(!t){ none.push(l.noun); return; }
    const key=t.name+'|'+t.v; let g=groups.find(x=>x.key===key); if(!g){ g={key,verb:verbs[t.name]||t.name.toLowerCase(),lim:t.v===1,areas:[]}; groups.push(g);} g.areas.push(l.short); });

function topicState(t){ if(t.m) return 'here'; if(t.v&&!t.ext) return 'video'; if(t.v) return 'ext'; return 'gap'; }
function catStats(c){ const ts=catTopics(c), st={here:0,video:0,ext:0,gap:0}; ts.forEach(t=>st[topicState(t)]++); st.n=ts.length; st.covered=st.here+st.video; return st; }
const CAT_LABEL={here:['done','In this pack'],video:['vid','Video'],ext:['soon','External user view only'],gap:['gap','No material yet']};
function catTopic(t){
  const k=topicState(t), [cls,lab]=CAT_LABEL[k];
  const links=[];
  if(t.m){ const m=modOf(t.m), p=prog(t.m); links.push(`<a href="#/guide/${t.m}">Module ${m.n} · ${esc(m.title)}</a>${p.done?` <span class="muted">${p.pct}%</span>`:''}`); }
  [t.v?{v:t.v,ext:t.ext}:null,...(t.also||[])].filter(Boolean).forEach(a=>{const v=vidOf(a.v); if(v) links.push(`<a href="#/videos#v-${v.id}">${I.play}${esc(v.title)}</a> <span class="muted">${fmtDur(v.dur)}${a.ext?' · external user’s side':''}${isWatched(v.id)?' · watched':''}</span>`);});
  return `<li class="ctopic ${k}"><div class="ct"><b>${esc(t.t)}</b><span class="chip ${cls}">${lab}</span></div><p>${esc(t.d)}</p>${links.length?`<div class="clinks">${links.join('')}</div>`:''}</li>`;
}

/* ---------- router ---------- */
function parse(){ const h=location.hash.replace(/^#/,'')||'/'; const [path,anchor]=h.split('#'); return {path:path||'/',anchor}; }
function render(){
  const {path,anchor}=parse(), main=$('#main');
  let html; W=null; Q=null; closeAnyModal(true);
  const gm=path.match(/^\/guide\/([\w-]+)(\/walk)?$/);
  if(path==='/') html=renderHome();
  else if(path==='/roles') html=renderRoles();
  else if(gm) html=gm[2]?renderWalk(gm[1],anchor):renderGuide(gm[1]);
  else if(path==='/qa'||path==='/coming-soon') html=renderQA();
  else if(path==='/videos') html=renderVideos();
  else if(path==='/catalogue') html=renderCatalogue();
  else html=renderNotFound();
  let banner=''; if(lastReset){ if(lastReset.fresh){ lastReset.fresh=false; banner=resetBanner(); } else lastReset=null; }
  main.innerHTML=banner+html;
  renderNav(path); renderTop(); closeMenu();
  const g=gm&&GUIDES[gm[1]];
  document.title=(path==='/roles'?'Roles & permissions — ':g?(gm[2]?'Walkthrough: ':'')+g.title+' — ':(path==='/qa'||path==='/coming-soon')?'Q&As — ':path==='/videos'?'Video library — ':path==='/catalogue'?'DSP training catalogue — ':'')+'REC Portal Content Training';
  if(gm&&!gm[2]&&QUIZZES[gm[1]]&&!GUIDES[gm[1]].soon) startQuiz(gm[1],false);
  if(path==='/roles') applyExplore();
  if(path==='/videos') applyVideoFilter();
  if(path==='/catalogue') applyCatFilter();
  if(W){ window.scrollTo(0,0); $('#wh')?.focus({preventScroll:true}); }
  else if(anchor){ const el=document.getElementById(anchor); if(el){ el.scrollIntoView({block:'start'}); el.setAttribute('tabindex','-1'); el.focus({preventScroll:true}); } }
  else { window.scrollTo(0,0); main.focus({preventScroll:true}); }
  wireTabs(); wireToc();
}

  if(e.target.id==='certName'){ S.learnerName=e.target.value.slice(0,80); save(); clearTimeout(drawCert._t); drawCert._t=setTimeout(drawCert,150); return; }
  if(e.target.id==='progIn'){ const er=$('#progErr'); if(er) er.hidden=true; }
  if(e.target.id==='vfilter'){ vQuery=e.target.value.trim().toLowerCase(); applyVideoFilter(); return; }
  if(e.target.id==='cfilter'){ cFilter=e.target.value.trim().toLowerCase(); const g=GUIDES.components; const tmp=document.createElement('div'); tmp.innerHTML=chooserPicker(g);
    $('#needList').innerHTML=tmp.querySelector('#needList').innerHTML; $('#cdetail').innerHTML=tmp.querySelector('#cdetail').innerHTML; }
});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const md=document.querySelector('.modal-back');
  if(md){
    if(e.key==='Escape'){ e.preventDefault(); closeAnyModal(); return; }
    if(e.key==='Tab'){ const f=[...md.querySelectorAll('button:not([disabled]),input,select,textarea,a[href]')].filter(x=>x.offsetParent!==null); const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();} else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();} }
    if(md.id==='amapModal'&&(e.key==='ArrowDown'||e.key==='ArrowUp')&&!/SELECT/.test(document.activeElement?.tagName)){ e.preventDefault(); amapStep(e.key==='ArrowDown'?1:-1); }
    return;
  }
  if(e.key==='Escape'){ closeMenu(); closeSearch(); }
  if(!typing&&(e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))){ e.preventDefault(); $('#q').focus(); return; }
  if(W&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(e.key==='ArrowRight'){ e.preventDefault(); walkGo(W.idx+1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); walkGo(W.idx-1); }
    else if(e.key.toLowerCase()==='d'){ e.preventDefault(); walkAction('toggle'); }
  }
});

function wireTabs(){
  const tabs=$$('[role=tab]'); if(!tabs.length) return;
  const sel=(t,focus)=>{tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;document.getElementById(x.getAttribute('aria-controls')).hidden=!on});if(focus)t.focus()};
  tabs.forEach(t=>{t.addEventListener('click',()=>sel(t,true));t.addEventListener('keydown',e=>{const i=tabs.indexOf(t);if(e.key==='ArrowRight'){e.preventDefault();sel(tabs[(i+1)%tabs.length],true)}if(e.key==='ArrowLeft'){e.preventDefault();sel(tabs[(i-1+tabs.length)%tabs.length],true)}})});
  const {anchor}=parse(); if(anchor&&anchor.startsWith('view-')){const t=tabs.find(x=>x.getAttribute('aria-controls')===anchor); if(t) sel(t,false);}
}
let tocObs;
function wireToc(){
  tocObs?.disconnect();
  const links=$$('[data-toc]'); if(!links.length) return;
  const secs=links.map(l=>document.getElementById(l.dataset.toc)).filter(Boolean);
  tocObs=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting) links.forEach(l=>l.classList.toggle('active',l.dataset.toc===en.target.id))})},{rootMargin:'-20% 0px -70% 0px'});
  secs.forEach(s=>tocObs.observe(s));
}

/* light / dark mode (dark is the default; choice remembered in this browser) */
const modeBtn=$('#modeBtn');
function syncModeBtn(){const light=document.documentElement.getAttribute('data-mode')==='light';const l=light?'Switch to dark mode':'Switch to light mode';modeBtn.setAttribute('aria-label',l);modeBtn.title=l;}
modeBtn.addEventListener('click',()=>{const next=document.documentElement.getAttribute('data-mode')==='light'?'dark':'light';document.documentElement.setAttribute('data-mode',next);try{localStorage.setItem('rec-mode',next)}catch(e){}syncModeBtn();toast(next==='light'?'Light mode':'Dark mode');});
syncModeBtn();

/* mobile menu */
const menuBtn=$('#menuBtn'), sidenav=$('#sidenav'), overlay=$('#overlay');
function closeMenu(){sidenav.classList.remove('open');overlay.classList.remove('show');menuBtn.setAttribute('aria-expanded','false')}
menuBtn.addEventListener('click',()=>{const o=!sidenav.classList.contains('open');sidenav.classList.toggle('open',o);overlay.classList.toggle('show',o);menuBtn.setAttribute('aria-expanded',o);if(o)sidenav.querySelector('a,button')?.focus()});
overlay.addEventListener('click',closeMenu);

/* ---------- search ---------- */
const INDEX=[];
(function build(){
  INDEX.push({t:'Roles & permissions',s:'Permission explorer, role definitions, roles × modules matrix, page types',to:'#/roles'});
  ROLES.forEach(r=>INDEX.push({t:r.name,s:r.desc,to:'#/roles#defs'}));
  MODULES.forEach(m=>{INDEX.push({t:m.title,s:`Module ${m.n} · ${m.blurb}`,to:'#/guide/'+m.id}); if(QUIZZES[m.id]) INDEX.push({t:'Knowledge check: '+m.title,s:`Module ${m.n} · ${QUIZZES[m.id].length} questions`,to:`#/guide/${m.id}#quiz`}); if(!m.soon) INDEX.push({t:'Guided walkthrough: '+m.title,s:`Module ${m.n} · one step at a time`,to:`#/guide/${m.id}/walk`});});
  Object.entries(GUIDES).forEach(([id,g])=>{
    itemsOf(id).forEach(it=>{ if(g.tricksList) return; INDEX.push({t:it.s.t,s:`${g.title} · ${it.part?it.part+' · ':''}step ${it.n}${it.s.screen?' · '+it.s.screen:''}`,to:`#/guide/${id}#${it.key}`,body:[].concat(...it.s.b.map(x=>Array.isArray(x)?x:[x])).join(' ')}); });
    g.tips?.forEach(([a,b])=>INDEX.push({t:a,s:`${g.title} · tip${b?' · '+b:''}`,to:`#/guide/${id}#outcome`}));
    g.chooser?.forEach(r=>INDEX.push({t:r[1],s:`Component · ${r[0]} · ${r[4]}`,to:`#/guide/${id}#chooser`}));
    g.tricksList?.forEach(t=>INDEX.push({t:t.what,s:`Useful trick · ${t.area}`,to:`#/guide/${id}#list`,body:t.how}));
  });
  QUESTIONS.forEach(q=>INDEX.push({t:q.q,s:q.soon?'Open question':q.partial?'Partly answered':q.who,to:q.to}));
  QA.forEach(g=>g.items.forEach(it=>INDEX.push({t:it.q,s:`Q&A · ${g.title}`,to:`#/qa#qa-${g.id}`,body:it.a.join(' ')})));
  INDEX.push({t:'Live component list',s:`${COMPONENT_LIST.env} · every component with its image size`,to:'#/guide/components#live'});
  COMPONENT_LIST.items.forEach(c=>INDEX.push({t:c.name+' component',s:`Live component list${c.size?' · '+c.size+'px':''}`,to:'#/guide/components#live',body:c.note}));
  INDEX.push({t:'DSP training catalogue',s:`${CATALOGUE.length} DSP courses, what each covers and where training exists`,to:'#/catalogue'});
  CATALOGUE.forEach(c=>INDEX.push({t:c.title,s:`DSP course · ${c.here?'covered in this pack':c.soon?'coming soon':catStats(c).gap?catStats(c).gap+' topics without material':'videos available'}`,to:`#/catalogue#cat-${c.id}`,body:c.who+' '+catTopics(c).map(t=>t.t+' '+t.d).join(' ')}));
  INDEX.push({t:'Video library',s:`${VIDEOS.length} videos · party management, service desk, external users`,to:'#/videos'});
  VIDEOS.forEach(v=>INDEX.push({t:v.title,s:`Video · ${seriesOf(v.series).title} · ${fmtDur(v.dur)}`,to:`#/videos#v-${v.id}`,body:v.summary+' '+v.learn.join(' ')+' '+v.chapters.map(c=>c[1]).join(' ')}));
})();
const q=$('#q'), res=$('#searchResults');
function closeSearch(){res.hidden=true;q.setAttribute('aria-expanded','false')}
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(v.length<2){closeSearch();return}
  const hits=INDEX.map(x=>{const hay=(x.t+' '+x.s+' '+(x.body||'')).toLowerCase();let sc=0;v.split(/\s+/).forEach(w=>{if(x.t.toLowerCase().includes(w))sc+=3;else if(hay.includes(w))sc+=1});return [sc,x]}).filter(([s])=>s>0).sort((a,b)=>b[0]-a[0]).slice(0,10);
  res.innerHTML=hits.length?hits.map(([,x])=>`<a href="${x.to}"><div class="t">${esc(x.t)}</div><div class="s">${esc(x.s)}</div></a>`).join(''):`<div class="empty">No matches for “${esc(q.value)}”. Try a step name, a role or a component.</div>`;
  res.hidden=false;q.setAttribute('aria-expanded','true');
});
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){const f=res.querySelector('a');if(f){e.preventDefault();f.focus()}} if(e.key==='Enter'){const f=res.querySelector('a');if(f){e.preventDefault();location.hash=f.getAttribute('href').slice(1);closeSearch();q.value='';q.blur()}}});
res.addEventListener('keydown',e=>{const items=[...res.querySelectorAll('a')];const i=items.indexOf(document.activeElement);if(e.key==='ArrowDown'&&items[i+1]){e.preventDefault();items[i+1].focus()}if(e.key==='ArrowUp'){e.preventDefault();(items[i-1]||q).focus()}});
res.addEventListener('click',()=>{closeSearch();q.value=''});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))closeSearch()});

render();

</script>
