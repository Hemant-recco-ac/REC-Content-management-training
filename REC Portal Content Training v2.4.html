/* ---------- router ---------- */
function parse(){ const h=location.hash.replace(/^#/,'')||'/'; const [path,anchor]=h.split('#'); return {path:path||'/',anchor}; }
function render(){
  const {path,anchor}=parse(), main=$('#main');
  let html; W=null; Q=null;
  const gm=path.match(/^\/guide\/([\w-]+)(\/walk)?$/);
  if(path==='/') html=renderHome();
  else if(path==='/roles') html=renderRoles();
  else if(gm) html=gm[2]?renderWalk(gm[1],anchor):renderGuide(gm[1]);
  else if(path==='/coming-soon') html=renderComingSoon();
  else if(path==='/videos') html=renderVideos();
  else html=renderNotFound();
  let banner=''; if(lastReset){ if(lastReset.fresh){ lastReset.fresh=false; banner=resetBanner(); } else lastReset=null; }
  main.innerHTML=banner+html;
  renderNav(path); renderTop(); closeMenu();
  const g=gm&&GUIDES[gm[1]];
  document.title=(path==='/roles'?'Roles & permissions — ':g?(gm[2]?'Walkthrough: ':'')+g.title+' — ':path==='/coming-soon'?'Not yet covered — ':path==='/videos'?'Video library — ':'')+'REC Portal Content Training';
  if(gm&&!gm[2]&&QUIZZES[gm[1]]&&!GUIDES[gm[1]].soon) startQuiz(gm[1],false);
  if(path==='/roles') applyExplore();
  if(path==='/videos') applyVideoFilter();
  if(W){ window.scrollTo(0,0); $('#wh')?.focus({preventScroll:true}); }
  else if(anchor){ const el=document.getElementById(anchor); if(el){ el.scrollIntoView({block:'start'}); el.setAttribute('tabindex','-1'); el.focus({preventScroll:true}); } }
  else { window.scrollTo(0,0); main.focus({preventScroll:true}); }
  wireTabs(); wireToc();
}
window.addEventListener('hashchange',render);

/* ---------- events (delegated) ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const ck=t.closest('[data-check]');
  if(ck){ const [id,key]=ck.dataset.check.split('|'); const on=!isDone(id,key); setDone(id,key,on);
    ck.setAttribute('aria-pressed',on); ck.querySelector('.lbl').textContent=on?'Done':'Mark done';
    ck.setAttribute('aria-label',(on?'Done: ':'Mark as done: ')+ck.getAttribute('aria-label').split(': ').slice(1).join(': '));
    const card=ck.closest('.step'); if(card){ card.classList.toggle('done',on); const n=card.querySelector('.no'); n.innerHTML=on?I.check:(itemsOf(id).find(x=>x.key===key)?.n||''); }
    refresh(); const p=prog(id); toast(p.pct===100?`Module ${modOf(id).n} complete`:on?`Step done · ${p.done} of ${p.total}`:'Step unmarked'); return; }
  const rb=t.closest('[data-role]');
  if(rb){ S.role=rb.dataset.role; save(); const v=ROLE_VIEWS.find(r=>r.id===S.role); toast(v?'Learning path set: '+v.label:'Showing all modules');
    if(rb.dataset.stay){ render(); } else if(parse().path==='/') { render(); } else location.hash='#/'; return; }
  const act=t.closest('[data-action]');
  if(act){ const a=act.dataset.action;
    if(a==='change-role'){ S.role=null; save(); if(parse().path==='/') render(); else location.hash='#/'; setTimeout(()=>$('#choose .opt')?.focus(),50); }
    if(a==='focus-picker'){ setTimeout(()=>$('#choose .opt')?.focus(),60); }
    if(a==='reset'){ openReset('all'); }
    if(a==='reset-module'){ openReset('module',act.dataset.mod); }
    if(a==='reset-cancel'){ closeReset(); }
    if(a==='reset-confirm'){ doReset(); }
    if(a==='reset-undo'){ undoReset(); }
    return; }
  const ex=t.closest('[data-explore]');
  if(ex){ exploreRole=ex.dataset.explore; applyExplore(); if(ex.dataset.scroll) document.getElementById(ex.dataset.scroll)?.scrollIntoView({block:'start'}); return; }
  const nd=t.closest('[data-need]');
  if(nd){ cSel=+nd.dataset.need; $$('[data-need]').forEach(b=>b.setAttribute('aria-pressed',b===nd)); $('#cdetail').innerHTML=componentDetail(GUIDES.components.chooser[cSel]); if(matchMedia('(max-width:1000px)').matches) $('#cdetail').scrollIntoView({block:'nearest'}); return; }
  const cv=t.closest('[data-cview]');
  if(cv){ $$('[data-cview]').forEach(b=>b.setAttribute('aria-pressed',b===cv)); $('#cview').innerHTML=cv.dataset.cview==='table'?chooserTable(GUIDES.components):chooserPicker(GUIDES.components); return; }
  const bk=t.closest('[data-blk]');
  if(bk){ $$('[data-blk]').forEach(b=>b.setAttribute('aria-pressed',b===bk)); $('#blkinfo').innerHTML=blockInfo(+bk.dataset.blk); return; }
  const vw=t.closest('[data-watch]');
  if(vw){ const id=vw.dataset.watch, on=!isWatched(id); S.watched=on?[...S.watched,id]:S.watched.filter(x=>x!==id); save();
    vw.setAttribute('aria-pressed',on); vw.querySelector('.lbl').textContent=on?'Watched':'Mark watched'; vw.setAttribute('aria-label',(on?'Watched: ':'Mark as watched: ')+VIDEOS.find(v=>v.id===id).title);
    refreshVideoCounts(); renderNav(parse().path); toast(on?'Marked as watched':'Unmarked'); return; }
  const vf=t.closest('[data-vf]');
  if(vf){ vFilter=vf.dataset.vf; $$('[data-vf]').forEach(b=>b.setAttribute('aria-pressed',b===vf)); applyVideoFilter(); return; }
  const qa=t.closest('[data-quiz]');
  if(qa){ quizAction(qa.dataset.quiz); return; }
  const wa=t.closest('[data-walk]');
  if(wa){ walkAction(wa.dataset.walk); return; }
  const go=t.closest('[data-go]');
  if(go){ walkGo(+go.dataset.go); return; }
  const qf=t.closest('[data-qf]');
  if(qf){ const w=qf.dataset.qf; $$('[data-qf]').forEach(b=>b.setAttribute('aria-pressed',b===qf)); $$('#qlist li').forEach(li=>li.hidden=!(w==='All'||li.dataset.who===w)); return; }
  const cp=t.closest('[data-copy]');
  if(cp){ const txt=cp.dataset.copy; const ok=()=>toast('Copied '+txt); try{ navigator.clipboard.writeText(txt).then(ok,()=>toast('Select the address to copy it')); }catch(err){ toast('Select the address to copy it'); } return; }
  /* in-page anchors inside a route */
  const a=t.closest('a[href^="#"]');
  if(a){ const href=a.getAttribute('href'); if(href.startsWith('#/')) return; const id=href.slice(1), el=document.getElementById(id);
    if(el){ e.preventDefault(); el.scrollIntoView({block:'start'}); el.setAttribute('tabindex','-1'); el.focus({preventScroll:true}); history.replaceState(null,'','#'+parse().path+'#'+id); } }
});
document.addEventListener('change',e=>{
  if(e.target.name==='qo'&&Q&&!Q.checked){ Q.ans[Q.i]=+e.target.value; const b=$('[data-quiz=check]'); if(b) b.disabled=false; }
});
document.addEventListener('input',e=>{
  if(e.target.id==='vfilter'){ vQuery=e.target.value.trim().toLowerCase(); applyVideoFilter(); return; }
  if(e.target.id==='cfilter'){ cFilter=e.target.value.trim().toLowerCase(); const g=GUIDES.components; const tmp=document.createElement('div'); tmp.innerHTML=chooserPicker(g);
    $('#needList').innerHTML=tmp.querySelector('#needList').innerHTML; $('#cdetail').innerHTML=tmp.querySelector('#cdetail').innerHTML; }
});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if($('#resetModal')){
    if(e.key==='Escape'){ e.preventDefault(); closeReset(); return; }
    if(e.key==='Tab'){ const f=[...$('#resetModal').querySelectorAll('button,input')]; const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();} else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();} }
    return;
  }
  if(e.key==='Escape'){ closeMenu(); closeSearch(); }
  if(!typing&&(e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))){ e.preventDefault(); $('#q').focus(); return; }
  if(W&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(e.key==='ArrowRight'){ e.preventDefault(); walkGo(W.idx+1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); walkGo(W.idx-1); }
    else if(e.key.toLowerCase()==='d'){ e.preventDefault(); walkAction('toggle'); }
  }
});

function wireTabs(){
  const tabs=$$('[role=tab]'); if(!tabs.length) return;
  const sel=(t,focus)=>{tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;document.getElementById(x.getAttribute('aria-controls')).hidden=!on});if(focus)t.focus()};
  tabs.forEach(t=>{t.addEventListener('click',()=>sel(t,true));t.addEventListener('keydown',e=>{const i=tabs.indexOf(t);if(e.key==='ArrowRight'){e.preventDefault();sel(tabs[(i+1)%tabs.length],true)}if(e.key==='ArrowLeft'){e.preventDefault();sel(tabs[(i-1+tabs.length)%tabs.length],true)}})});
  const {anchor}=parse(); if(anchor&&anchor.startsWith('view-')){const t=tabs.find(x=>x.getAttribute('aria-controls')===anchor); if(t) sel(t,false);}
}
let tocObs;
function wireToc(){
  tocObs?.disconnect();
  const links=$$('[data-toc]'); if(!links.length) return;
  const secs=links.map(l=>document.getElementById(l.dataset.toc)).filter(Boolean);
  tocObs=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting) links.forEach(l=>l.classList.toggle('active',l.dataset.toc===en.target.id))})},{rootMargin:'-20% 0px -70% 0px'});
  secs.forEach(s=>tocObs.observe(s));
}

/* light / dark mode (dark is the default; choice remembered in this browser) */
const modeBtn=$('#modeBtn');
function syncModeBtn(){const light=document.documentElement.getAttribute('data-mode')==='light';const l=light?'Switch to dark mode':'Switch to light mode';modeBtn.setAttribute('aria-label',l);modeBtn.title=l;}
modeBtn.addEventListener('click',()=>{const next=document.documentElement.getAttribute('data-mode')==='light'?'dark':'light';document.documentElement.setAttribute('data-mode',next);try{localStorage.setItem('rec-mode',next)}catch(e){}syncModeBtn();toast(next==='light'?'Light mode':'Dark mode');});
syncModeBtn();

/* mobile menu */
const menuBtn=$('#menuBtn'), sidenav=$('#sidenav'), overlay=$('#overlay');
function closeMenu(){sidenav.classList.remove('open');overlay.classList.remove('show');menuBtn.setAttribute('aria-expanded','false')}
menuBtn.addEventListener('click',()=>{const o=!sidenav.classList.contains('open');sidenav.classList.toggle('open',o);overlay.classList.toggle('show',o);menuBtn.setAttribute('aria-expanded',o);if(o)sidenav.querySelector('a,button')?.focus()});
overlay.addEventListener('click',closeMenu);

/* ---------- search ---------- */
const INDEX=[];
(function build(){
  INDEX.push({t:'Roles & permissions',s:'Permission explorer, role definitions, roles × modules matrix, page types',to:'#/roles'});
  ROLES.forEach(r=>INDEX.push({t:r.name,s:r.desc,to:'#/roles#defs'}));
  MODULES.forEach(m=>{INDEX.push({t:m.title,s:`Module ${m.n} · ${m.blurb}`,to:'#/guide/'+m.id}); if(QUIZZES[m.id]) INDEX.push({t:'Knowledge check: '+m.title,s:`Module ${m.n} · ${QUIZZES[m.id].length} questions`,to:`#/guide/${m.id}#quiz`}); if(!m.soon) INDEX.push({t:'Guided walkthrough: '+m.title,s:`Module ${m.n} · one step at a time`,to:`#/guide/${m.id}/walk`});});
  Object.entries(GUIDES).forEach(([id,g])=>{
    itemsOf(id).forEach(it=>{ if(g.tricksList) return; INDEX.push({t:it.s.t,s:`${g.title} · ${it.part?it.part+' · ':''}step ${it.n}${it.s.screen?' · '+it.s.screen:''}`,to:`#/guide/${id}#${it.key}`,body:[].concat(...it.s.b.map(x=>Array.isArray(x)?x:[x])).join(' ')}); });
    g.tips?.forEach(([a,b])=>INDEX.push({t:a,s:`${g.title} · tip${b?' · '+b:''}`,to:`#/guide/${id}#outcome`}));
    g.chooser?.forEach(r=>INDEX.push({t:r[1],s:`Component · ${r[0]} · ${r[4]}`,to:`#/guide/${id}#chooser`}));
    g.tricksList?.forEach(t=>INDEX.push({t:t.what,s:`Useful trick · ${t.area}`,to:`#/guide/${id}#list`,body:t.how}));
  });
  QUESTIONS.forEach(q=>INDEX.push({t:q.q,s:q.soon?'Not yet covered':q.who,to:q.to}));
  INDEX.push({t:'Video library',s:`${VIDEOS.length} videos · party management, service desk, external users`,to:'#/videos'});
  VIDEOS.forEach(v=>INDEX.push({t:v.title,s:`Video · ${seriesOf(v.series).title} · ${fmtDur(v.dur)}`,to:`#/videos#v-${v.id}`,body:v.summary+' '+v.learn.join(' ')+' '+v.chapters.map(c=>c[1]).join(' ')}));
})();
const q=$('#q'), res=$('#searchResults');
function closeSearch(){res.hidden=true;q.setAttribute('aria-expanded','false')}
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(v.length<2){closeSearch();return}
  const hits=INDEX.map(x=>{const hay=(x.t+' '+x.s+' '+(x.body||'')).toLowerCase();let sc=0;v.split(/\s+/).forEach(w=>{if(x.t.toLowerCase().includes(w))sc+=3;else if(hay.includes(w))sc+=1});return [sc,x]}).filter(([s])=>s>0).sort((a,b)=>b[0]-a[0]).slice(0,10);
  res.innerHTML=hits.length?hits.map(([,x])=>`<a href="${x.to}"><div class="t">${esc(x.t)}</div><div class="s">${esc(x.s)}</div></a>`).join(''):`<div class="empty">No matches for “${esc(q.value)}”. Try a step name, a role or a component.</div>`;
  res.hidden=false;q.setAttribute('aria-expanded','true');
});
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){const f=res.querySelector('a');if(f){e.preventDefault();f.focus()}} if(e.key==='Enter'){const f=res.querySelector('a');if(f){e.preventDefault();location.hash=f.getAttribute('href').slice(1);closeSearch();q.value='';q.blur()}}});
res.addEventListener('keydown',e=>{const items=[...res.querySelectorAll('a')];const i=items.indexOf(document.activeElement);if(e.key==='ArrowDown'&&items[i+1]){e.preventDefault();items[i+1].focus()}if(e.key==='ArrowUp'){e.preventDefault();(items[i-1]||q).focus()}});
res.addEventListener('click',()=>{closeSearch();q.value=''});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))closeSearch()});

render();

</script>
